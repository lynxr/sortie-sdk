# The DCS API catalog: the allow-list of the universal call (`DcsCall`, `DcsBatch`).
#
# One entry per DCS function (or value) that a logic may call by its Lua path. The engine
# validates every call against its entry before anything reaches DCS; the `call:<env>:<path>`
# capabilities, the typed wrappers of the Rust SDK (`ctx.dcs()`) and of the Python client
# (`sortie_gen.dcs_api`) and the reference page `sdk/docs/dcs-catalog.md` are generated from
# this file (`cargo xtask catalog-gen`). The engine owner narrows or extends it in
# `<Saved Games>/Sortie/engine.toml`, section `[calls]`.
#
# Fields of an entry:
#   path           canonical Lua path: "land.getHeight", or "<Class>.<method>" for a method on
#                  the class that defines it ("Object.getPoint", not "Unit.getPoint"). For a
#                  method the path is the entry's name, not where the function is looked up:
#                  the Lua layer runs it through the class table of the receiver, as
#                  receiver:method() does. The classes follow the DCS documentation;
#                  CoalitionObject exists there only (the game declares Unit, StaticObject,
#                  Airbase and Weapon directly under Object and has no CoalitionObject table)
#   env            "mission" | "hooks"
#   receiver       "" for a plain function, else the class of the method's receiver
#   args           argument types in order, each "<type> <name>"; a type ending in "?" may be nil
#                  (and left out at the end). Types: number string boolean table vec2 vec3 any
#                  mizpath side_number side_name player item object:<Class> id:<Class>
#                  name:<Class> enum:<table path>. vec2 is a map point {x = north, y = east}; vec3
#                  is {x, y, z} in runtime axes (x north, y up, z east); item is a warehouse item,
#                  its name or its wsType {a, b, c, d} (four whole numbers)
#   returns        return types in order (same notation; also list:<type>, handle:<Class>). A
#                  `number` DCS returns as a numeric string comes back as the number
#   class          "read" | "mutate" | "heavy" | "admin"
#   guards         checks applied whatever the owner enabled (an owner entry cannot remove one)
#   live_check     the live-check id that verifies the entry on a running DCS
#   since_api_rev  the API revision that introduced the entry
#   doc            one line for the reference page and the generated wrappers
#   documented     false: a probe-gated read, off until its probe passed on the running build
#   enabled        default on/off (reads: on when documented; mutators: off)
#   family         SDK family of the wrapper (default: from the path); wrapper: its method name
#   kind           "function" (default) or "value" (a table or value read, not a call)
#   clamp          bounds of numeric arguments by name, e.g. { power = [0, 5000] }
#   creates        the first return value is a created handle of this class (never evicted)
#   destroys       true: the call ends the receiver's handle
#   superseded_by  the typed operation that replaces this raw path (the wrapper is deprecated)
#   note           anything the reader of the reference page must know
#   canonical      plain-data arguments valid on every map, for the probation call after a crash
#                  quarantine (documented reads without a receiver; a read that needs no
#                  arguments needs none)

version = 1

# ----- land --------------------------------------------------------------------------------

[[call]]
path = "land.getHeight"
canonical = [{ x = 0.0, y = 0.0 }]
env = "mission"
args = ["vec2 point"]
returns = ["number"]
class = "read"
live_check = "ENV-LC1"
since_api_rev = 1
doc = "Terrain height (m above sea level) at a map point."
wrapper = "height"

[[call]]
path = "land.getSurfaceHeightWithSeabed"
canonical = [{ x = 0.0, y = 0.0 }]
env = "mission"
args = ["vec2 point"]
returns = ["number", "number"]
class = "read"
live_check = "ENV-LC1"
since_api_rev = 1
doc = "Surface height and seabed depth (m) at a map point."
wrapper = "surface_height_with_seabed"

[[call]]
path = "land.getSurfaceType"
canonical = [{ x = 0.0, y = 0.0 }]
env = "mission"
args = ["vec2 point"]
returns = ["enum:land.SurfaceType"]
class = "read"
live_check = "ENV-LC1"
since_api_rev = 1
doc = "Surface type at a map point: LAND, SHALLOW_WATER, WATER, ROAD or RUNWAY."
wrapper = "surface_type"

[[call]]
path = "land.isVisible"
canonical = [{ x = 0.0, y = 2000.0, z = 0.0 }, { x = 1000.0, y = 2000.0, z = 1000.0 }]
env = "mission"
args = ["vec3 origin", "vec3 destination"]
returns = ["boolean"]
class = "read"
live_check = "ENV-LC4"
since_api_rev = 1
doc = "Whether the terrain leaves a line of sight between two points (objects do not block it)."
wrapper = "is_visible"

[[call]]
path = "land.getIP"
env = "mission"
args = ["vec3 origin", "vec3 direction", "number distance"]
returns = ["vec3?"]
class = "read"
live_check = "ENV-LC5"
since_api_rev = 1
doc = "Where a ray from origin along direction first hits the terrain within distance (m), or nil."
wrapper = "intersection"
clamp = { distance = [0, 300000] }

[[call]]
path = "land.profile"
env = "mission"
args = ["vec3 origin", "vec3 destination"]
returns = ["list:vec3"]
class = "read"
live_check = "ENV-LC6"
since_api_rev = 1
doc = "Terrain profile between two points as a list of points on the ground."
wrapper = "profile"
guards = ["span_300km"]
note = "DCS reads x and z of both points and ignores y. The end points may lie at most 300 km apart."

[[call]]
path = "land.getClosestPointOnRoads"
env = "mission"
args = ["string road_type", "number x", "number y"]
returns = ["number", "number"]
class = "read"
live_check = "ENV-LC1"
since_api_rev = 1
doc = "The closest point on a road (road_type \"roads\" or \"railroads\") to map coordinates x (north), y (east)."
wrapper = "closest_point_on_roads"

