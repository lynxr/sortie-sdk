// Commands: data, never Lua code. Every command has exactly one CommandResult.
syntax = "proto3";

package sortie.v1;

import "sortie/v1/common.proto";
import "sortie/v1/resources.proto";
import "sortie/v1/world.proto";

service Commands {
  // Executes one command in the current session and waits for its result.
  rpc Submit(Command) returns (CommandResult);
}

enum Lane {
  LANE_UNSPECIFIED = 0;
  // Hooks environment (server control).
  LANE_CONTROL = 1;
  // Small latency-sensitive mission commands (options, messages, flags, tasks).
  LANE_REALTIME = 2;
  // Spawns and other heavy work; rate limited.
  LANE_BULK = 3;
  // Read-only queries.
  LANE_QUERY = 4;
}

// What to do with a command while the simulation is paused.
enum PausePolicy {
  PAUSE_POLICY_UNSPECIFIED = 0;
  // Keep it queued until the simulation resumes (default).
  PAUSE_POLICY_WAIT = 1;
  // Fail with ERROR_CODE_PAUSED.
  PAUSE_POLICY_FAIL = 2;
}

// Where a command comes from (shown in traces and error messages).
message Origin {
  string logic = 1;
  string build_id = 2;
  string file = 3;
  uint32 line = 4;
  uint32 column = 5;
}

message Command {
  // Correlates SDK -> engine -> bridge and names the trace span. The SDK sends
  // "<session4>-<proc>-<n>": the session id's last 4 characters, a 6-character token drawn once
  // per logic process, and that process's counter, so ids never repeat across logic processes.
  // Empty = the engine assigns "api-<n>".
  string id = 1;
  // Idempotency key within the session: a repeat returns the stored result.
  string key = 2;
  // UNSPECIFIED = engine picks the lane from the body.
  Lane lane = 3;
  // 0 = engine default.
  uint32 timeout_ms = 4;
  PausePolicy on_pause = 5;
  // Id of a command that must complete (successfully) before this one starts.
  string after = 6;
  Origin origin = 7;
  // Target session; empty = current. A stale session yields ERROR_CODE_SESSION_ENDED.
  string session = 8;
  // W1. The lowest engine API revision that understands every field this command uses.
  // The SDK fills it from the newest builder or field it used. An engine with a lower
  // api_rev answers ERROR_CODE_UNAVAILABLE (CommandError.capability names the operation)
  // instead of running the command with defaults for fields it cannot see. A 0.1.0 engine
  // does not know this field: against it the SDK refuses locally (Start.api_rev absent = 0).
  uint32 min_api_rev = 9;
  oneof body {
    SpawnGroup spawn_group = 10;
    // W1. A static object, cargo or FARP (spec 5.1).
    SpawnStatic spawn_static = 11;
    Destroy destroy = 12;
    // W1. The universal call: one DCS function of the catalog.
    DcsCall dcs_call = 13;
    SetTask set_task = 14;
    // W1. Several universal calls executed in one frame.
    DcsBatch dcs_batch = 15;
    SetOption set_option = 16;
    Message message = 20;
    Effect effect = 21;
    Flag flag = 22;
    Menu menu = 23;
    MarkCommand mark = 24;
    EndSession end_session = 25;
    // W1. Create or update a registered resource (resources.proto); reply.resource.
    ResourcePut put = 26;
    // W1. Remove registered resources (resources.proto); reply.resource.
    ResourceRemove remove = 27;
    // W1. world.removeJunk in DCS volumes.
    RemoveJunk remove_junk = 28;
    Query query = 30;
    ServerControl server = 32;
    // W1. Many SpawnGroup and SpawnStatic in one command, spread by the spawn gate.
    SpawnBatch spawn_batch = 35;
    // W2. Owner, DCS's auto capture and radio silence of a list of airbases, applied in one
    // DCS frame (API revision 3: send min_api_rev = 3).
    AirbaseControl airbase_control = 36;
    // W2. Changes of warehouse stock (set, add, remove, transfer) applied in one DCS frame, all
    // or nothing (API revision 3: send min_api_rev = 3).
    WarehouseOp warehouse_op = 37;
    DevEval dev_eval = 99;
  }
  // W1. API revision whose behaviour the caller expects for this command (the gates of
  // spec section 8.3). On the Logic stream 0 = the revision declared at Attach. On
  // Commands.Submit 0 = 0.1.0 behaviour.
  uint32 api_rev = 40;
}

message CommandResult {
  string id = 1;
  double model_time = 2;
  // Time spent inside DCS executing the command, microseconds.
  uint32 cost_us = 3;
  oneof outcome {
    LuaValue ok = 4;
    CommandError err = 5;
  }
  // Eid of the object the command created (SpawnGroup: the group), 0 otherwise.
  // Eids never travel inside LuaValue (doubles cannot hold every uint64).
  uint64 eid = 6;
  // W1. Typed part of the result; `ok` stays for raw results. Which fields a command
  // fills is stated on that command. Unset for commands with no typed result.
  Reply reply = 7;
  // W1. true when this result answers a keyed repeat: identities (eid, names) come from the
  // stored result, snaps in `reply` were read from the mirror again at replay time.
  bool replayed = 8;
  // W1. Mirror revision that contains every effect of the command. The mirror is the
  // truth; `reply` is a copy taken at this revision. 0 = the command did not touch the mirror.
  uint64 world_rev = 9;
}

// W1. Typed part of a CommandResult. A flat message: each command fills the fields its own
// comment names and leaves the rest empty. `CommandResult.ok` keeps the raw value.
// A Reply is a copy of mirror state taken at CommandResult.world_rev; the mirror stays the
// truth. A Reply may accompany an error (a REPLACE spawn that failed after the destroy).
// Filled in 0.2.0: SpawnGroup (groups[0] = the group, entities = its units in DCS order),
// SpawnStatic (entities[0] = the static; with `heliport` also airbases[0]), Destroy (groups /
// entities = the last known snaps of what was removed), RemoveJunk (junk) and ResourcePut /
// ResourceRemove / MarkCommand (resource).
message Reply {
  // Objects the command created, changed, returned or (Destroy) removed, as the mirror
  // knows them at world_rev. Order is stated per command.
  repeated EntitySnap entities = 1;
  repeated GroupSnap groups = 2;
  repeated AirbaseSnap airbases = 3;
  // ResourcePut, ResourceRemove and MarkCommand (which registers as a drawing).
  ResourceAck resource = 4;
  // DcsCall.
  DcsReturn call = 5;
  // DcsBatch.
  DcsBatchReturn batch = 6;
  // RemoveJunk.
  JunkRemoved junk = 7;
  // SpawnBatch: one per item, in item order (`groups` and `entities` then hold the snaps of
  // the items that ran, in item order).
  repeated SpawnResult spawns = 8;
  // Query.search_objects (API revision 2).
  FoundObjects found = 10;
  // AirbaseControl (API revision 3): one entry per requested airbase, in request order
  // (`airbases` then holds the snaps of those bases the mirror holds, in the same order).
  AirbasesControlled airbase_control = 11;
  // Query.airbase_parking, airbase_runways, airbase_state (API revision 3): one entry per
  // requested airbase, in request order (`airbases` then holds the snaps of those bases the
  // mirror holds, in the same order).
  AirbasesRead airbase_read = 12;
  // Query.warehouse_stock (API revision 3): one entry per requested warehouse, in request
  // order.
  WarehousesStock warehouse_stock = 13;
  // WarehouseOp (API revision 3): one entry per requested change, in request order.
  StockChanges warehouse_op = 14;
  // Query.item_names (API revision 3).
  ItemNameList item_names = 15;
  // 16..39 are assigned to waves 2..6 (spec, section 8.2).
}

// GroupSel and UnitSel moved to common.proto in 0.2.0 (same package, same numbers).

// Spawn a group from a manifest template (templates are kept out of the .miz).
// Result: ok = { name = <group name>, units = { <unit name>, ... } }, CommandResult.eid = group eid.
message SpawnGroup {
  // Template ident from the manifest, e.g. "RED_CAP".
  string template = 1;
  // Explicit group name; must be unique. Default: <template name>#<session4>-<n>.
  optional string name = 2;
  oneof placement {
    FromAirbase from_airbase = 3;
    SpawnAt at = 4;
  }
  // If neither placement is set, the template's own position and route are used.
}

message FromAirbase {
  // Airbase ident from the manifest, e.g. "MAYKOP_KHANSKAYA".
  string airbase = 1;
  StartType start = 2;
}

// Every mode puts the first unit of the template at `position` and gives the group one route
// point there (the template's route is not carried over).
message SpawnAt {
  Vec3 position = 1;
  double heading_rad = 2;
  // How the units face and stand (0.4.0, API revision 3: a command that sets FORMATION sends
  // min_api_rev = 3). UNSPECIFIED is the behaviour of 0.1.0 to 0.3.0, byte for byte.
  SpawnHeadingMode heading_mode = 3;
}

enum SpawnHeadingMode {
  // Every unit faces heading_rad; the units keep the template's offsets from the first unit,
  // not turned (0.1.0 to 0.3.0).
  SPAWN_HEADING_MODE_UNSPECIFIED = 0;
  // The formation turns as one body about the first unit by d = heading_rad - the template's
  // reference heading (manifest Template.heading_rad, else the first unit's heading): each
  // unit's offset from the first unit is turned by d, and each unit faces its template
  // heading + d.
  SPAWN_HEADING_MODE_FORMATION = 1;
}

// ---- W1: SpawnStatic ----
// coalition.addStaticObject, or coalition.addGroup(country, -1, ..) when `heliport` is set.
// Result: CommandResult.eid = the static's eid, reply.entities[0] = the static,
// reply.airbases[0] = the new airbase (with `heliport`), ok = { name = <static name> } (plus
// kept = true for NAME_CONFLICT_KEEP). The static and the airbase are read back by name after
// the add (what the add call returns is undocumented). No S_EVENT_BIRTH is raised by DCS for
// statics: the engine emits Birth{synthesised}. Statics count toward the spawn gate.
message SpawnStatic {
  // Unique among units and statics. Default: <type_name>#<session4>-<n>.
  optional string name = 1;
  // DCS type name, e.g. "Cafe", "ammo_cargo", "FARP", "Invisible FARP", "Mi-8MT".
  string type_name = 2;
  // DCS country key; the coalition follows the country.
  string country = 3;
  oneof placement {
    StaticAt at = 4;
    OnUnit on_unit = 5;
  }
  // DCS `category` string ("Fortifications", "Cargos", "Heliports", "Planes", ...).
  // Empty = taken from the engine's table `sortie.static_type` (type -> category, shape).
  // DCS cannot report it at run time, so a type the table lacks needs it set here
  // (ERROR_CODE_INVALID otherwise); for a type the table has it must match the table.
  string dcs_category = 6;
  // Model override; empty = the shape the table `sortie.static_type` names for the type.
  string shape_name = 7;
  // Spawn as a wreck.
  bool dead = 8;
  CargoSpec cargo = 9;
  HeliportSpec heliport = 10;
  string livery = 11;
  // Score for killing it (the mission-editor `rate`).
  uint32 score = 12;
  bool hidden = 13;
  NameConflict on_conflict = 14;
  // Extra keys merged into the DCS table. A key a typed field owns (name, type, category,
  // shape_name, x, y, heading, linkUnit, linkOffset, offsets, units, country, dead, mass,
  // canCargo, heliport_*) is ERROR_CODE_INVALID naming the key. The merged table passes
  // the same checks as the typed fields (string keys, plain data, finite numbers).
  LuaValue raw = 99;
}

message StaticAt {
  MapPoint position = 1;
  double heading_rad = 2;
}

// Linked to a ship (`linkUnit` + `linkOffset` + `offsets`).
message OnUnit {
  UnitSel unit = 1;
  // Metres forward and right of the ship's centre.
  double forward_m = 2;
  double right_m = 3;
  // Relative to the ship's heading.
  double angle_rad = 4;
}

message CargoSpec {
  double mass_kg = 1;
  // `canCargo`: can be hooked or loaded.
  bool liftable = 2;
}

message HeliportSpec {
  // FARP callsign by name ("London", "Dallas", ...; the engine's table `sortie.farp_callsign`).
  // Empty = the engine picks one this session has not given to a FARP yet.
  string callsign = 1;
  // Hertz, as every frequency in this API; 0 = 127.5 MHz. The Lua layer writes the DCS key
  // `heliport_frequency`, which is in MHz (127500000 -> 127.5).
  double frequency_hz = 2;
  // UNSPECIFIED = AM.
  Modulation modulation = 3;
}

message Destroy {
  oneof target {
    GroupSel group = 1;
    UnitSel unit = 2;
    // W1. Any object the mirror knows: a unit, a static or a cargo (by Eid or name). Scenery
    // is ERROR_CODE_UNAVAILABLE (capability "destroy.scenery"); weapons and ejected crew are
    // ERROR_CODE_UNAVAILABLE (capability "destroy.weapon") until they get Eids.
    ObjSel object = 3;
  }
  // W1. Without it, destroying a unit a player occupies (or a group with one) is
  // ERROR_CODE_REJECTED (enforced when the command's API revision is >= 1: Command.api_rev /
  // Attach.api_rev; a 0.1.0 logic keeps the old behaviour).
  bool allow_player = 4;
}

// ---- W1: RemoveJunk ----
// world.removeJunk for each volume: wrecks, craters and debris (what DCS counts as junk is
// not documented). Result: reply.junk, ok = the total as a number. Repeat-safe (a second run
// removes nothing more).
message RemoveJunk {
  // 1..=16 volumes. DCS removes inside its own volume types only: sphere, axis_box,
  // segment and pyramid are passed as they are; `area` is accepted for a circle (or a
  // circular manifest zone) without floor or ceiling and becomes a sphere on the ground. A
  // polygon, a quad zone, an `around` area or a floor/ceiling is ERROR_CODE_INVALID (it would
  // have to be widened).
  repeated Volume volumes = 1;
}

message JunkRemoved {
  uint32 total = 1;
  // One count per requested volume, in order.
  repeated uint32 per_volume = 2;
}

// ---- W1: SpawnBatch ----
// Many spawns in one command: the restore of a persistent campaign. Items are applied in
// order over as many pumps as the spawn gate needs (spec 5.1); nothing is rolled back.
// Each item passes the checks of its own command, and the whole batch is checked before its
// first item is sent (a failing check fails the command and nothing runs).
// Result: reply.spawns, one per item; reply.groups and reply.entities of the items that ran.
// The command is `ok` when it ran, whatever the items did. One idempotency key covers the
// batch; after a link drop the items are settled one by one by name (CONTRACTS §17).
message SpawnBatch {
  // 1..=512 items.
  repeated SpawnItem items = 1;
  // true: the first failing item stops the batch; the rest are reported `skipped`. The items
  // then go one at a time (the next is sent when the previous answered).
  bool stop_on_error = 2;
}

message SpawnItem {
  oneof spawn {
    SpawnGroup group = 1;
    SpawnStatic static_object = 2;
  }
}

message SpawnResult {
  // Eid of the group or static; 0 when the item failed or was skipped.
  uint64 eid = 1;
  // The item's final name (the engine's when the caller left it empty).
  string name = 2;
  // Unset = the item succeeded. A skipped item says why (stop_on_error, the deadline, a
  // dropped link).
  CommandError err = 3;
  bool skipped = 4;
  // The item ran in an earlier attempt of the same key whose result was lost with the
  // mission link; `eid` is the object the engine found by name (nothing spawned again).
  bool settled = 5;
}

message SetTask {
  GroupSel group = 1;
  // true = pushTask (keep the current task stack), false = setTask (replace).
  bool push = 2;
  oneof task {
    CapTask cap = 10;
    OrbitTask orbit = 11;
    RtbTask rtb = 12;
    // W2 (ground wave). The route of a ground group (API revision 3: send min_api_rev = 3). An
    // aircraft or naval group is INVALID.
    GroundRoute ground_route = 13;
    // A raw DCS task table, passed through unchanged.
    LuaValue raw = 99;
  }
}

// W2 (ground wave, API revision 3). The route of a ground group. The engine builds a DCS
// `Mission` task: a first point where the group's first live unit stands when DCS takes the
// task (the layer reads it then), with the formation and speed of `points[0]`, then `points` in
// order. A point's formation and speed are those of the leg that ends at it.
message GroundRoute {
  // 1..=256 points.
  repeated GroundRoutePoint points = 1;
  // m/s, > 0: the speed of every point that sets none. Unset = 20 km/h.
  optional double speed_mps = 2;
}

message GroundRoutePoint {
  // Map metres (x north, y east in DCS).
  MapPoint point = 1;
  // How the group drives to this point. UNSPECIFIED = OFF_ROAD.
  GroundFormation formation = 2;
  // m/s, > 0. Unset = the route's speed.
  optional double speed_mps = 3;
}

// How a ground group drives a leg of its route (the waypoint actions of DCS's Mission Editor;
// the engine maps each to DCS's name).
enum GroundFormation {
  GROUND_FORMATION_UNSPECIFIED = 0;
  // Straight across the ground, in column.
  GROUND_FORMATION_OFF_ROAD = 1;
  // Along the roads.
  GROUND_FORMATION_ON_ROAD = 2;
  // Along the railways (trains).
  GROUND_FORMATION_ON_RAILROADS = 3;
  // Off road, in line abreast.
  GROUND_FORMATION_RANK = 4;
  GROUND_FORMATION_CONE = 5;
  GROUND_FORMATION_VEE = 6;
  GROUND_FORMATION_DIAMOND = 7;
  GROUND_FORMATION_ECHELON_LEFT = 8;
  GROUND_FORMATION_ECHELON_RIGHT = 9;
}

message CapTask {
  // Zone ident from the manifest.
  string zone = 1;
  double altitude_m = 2;
  double speed_mps = 3;
}

enum OrbitPattern {
  ORBIT_PATTERN_UNSPECIFIED = 0;
  ORBIT_PATTERN_CIRCLE = 1;
  ORBIT_PATTERN_RACE_TRACK = 2;
}

message OrbitTask {
  MapPoint center = 1;
  double altitude_m = 2;
  double speed_mps = 3;
  OrbitPattern pattern = 4;
  // Second point for ORBIT_PATTERN_RACE_TRACK.
  MapPoint second = 5;
}

message RtbTask {
  // Airbase ident from the manifest; empty = nearest friendly airbase.
  string airbase = 1;
}

message SetOption {
  GroupSel group = 1;
  oneof option {
    AlarmState alarm_state = 2;
    Roe roe = 3;
  }
}

message Message {
  oneof to {
    Coalition coalition = 1;
    GroupSel group = 2;
    bool all = 3;
  }
  string text = 4;
  // Display time; 0 = engine default (10 s).
  uint32 seconds = 5;
  bool clear_view = 6;
}

message Effect {
  oneof kind {
    Smoke smoke = 1;
  }
}

message Smoke {
  Vec3 at = 1;
  SmokeColor color = 2;
  // true: ignore at.y and use the terrain height at (x, z).
  bool at_ground_level = 3;
}

// Set a user flag declared in the manifest.
message Flag {
  // Flag ident from the manifest, e.g. "SAM_NORTH_DOWN".
  string ident = 1;
  int32 value = 2;
}

enum MenuScope {
  MENU_SCOPE_UNSPECIFIED = 0;
  // One shared F10 entry per coalition; presses do not tell who pressed.
  MENU_SCOPE_COALITION = 1;
  // One entry per group of the coalition (added on BIRTH); presses carry the group.
  MENU_SCOPE_PER_GROUP = 2;
}

// Add (or remove) an F10 radio menu command declared in the manifest.
// Since 0.2.0 it registers as a menu (RESOURCE_KIND_MENU) named
// "sortie:menu/<ident>/<all|coalition|per_group>[/<red|blue|neutral>]", shown as the one-node
// MenuTree it stands for; the F10 entry behaves as in 0.1.0 (an equal repeat does nothing, a
// per-group entry follows the player groups of the coalition). It is removed at session end.
message Menu {
  MenuScope scope = 1;
  Coalition coalition = 2;
  // Menu ident from the manifest, e.g. "SMOKE_OBJECTIVE".
  string ident = 3;
  // Label override; empty = manifest label.
  string label = 4;
  // Sub-menu path; empty = manifest path.
  repeated string path = 5;
  bool remove = 6;
}

// Add (or remove) an F10 map mark. (Named MarkCommand to keep `Mark` for the event.)
// Since 0.2.0 it registers as a drawing (RESOURCE_KIND_DRAWING, the Draw{panel} it stands
// for, same name space as Draw): a put; `remove = true` is a ResourceRemove by name. An equal
// repeat does nothing in DCS; a changed one replaces the mark with a new DCS id.
message MarkCommand {
  // Caller-chosen stable name; the engine maps it to a DCS mark id.
  string name = 1;
  string text = 2;
  Vec3 at = 3;
  oneof to {
    Coalition coalition = 4;
    GroupSel group = 5;
    bool all = 6;
  }
  bool read_only = 7;
  bool remove = 8;
}

// End the session (turn). The engine computes MissionResults and notifies the generator.
message EndSession {
  Outcome outcome = 1;
  string text = 2;
}

message Query {
  oneof kind {
    DescByType desc_by_type = 1;
    LandHeight land_height = 2;
    FlagValue flag_value = 3;
    // API revision 2 (send min_api_rev = 2).
    SearchObjects search_objects = 4;
    // W2. The airbase queries (API revision 3: send min_api_rev = 3); reply.airbase_read.
    AirbaseParking airbase_parking = 5;
    AirbaseRunways airbase_runways = 6;
    AirbaseStates airbase_state = 7;
    // W2. The stock of warehouses (API revision 3: send min_api_rev = 3); reply.warehouse_stock.
    WarehouseStocks warehouse_stock = 8;
    // W2. The names DCS gives the items it knows, with their wsTypes (API revision 3: send
    // min_api_rev = 3); reply.item_names.
    ItemNames item_names = 9;
  }
}

// Unit.getDescByName(type_name); ok = the desc table or nil.
message DescByType {
  string type_name = 1;
}

// land.getHeight; ok = number.
message LandHeight {
  MapPoint at = 1;
}

// trigger.misc.getUserFlag; ok = number.
message FlagValue {
  string ident = 1;
}

// ---- W2: SearchObjects (API revision 2) ----
// world.searchObjects over one volume; a read (lane QUERY, nothing changes in DCS or in the
// mirror). The Lua layer collects the objects DCS hands its search function and reads each
// one: category, name, type, position, life, the life of the undamaged object, coalition.
// The engine names an object its mirror holds by its Eid. Result: reply.found; `ok` = the
// number of objects found.
message SearchObjects {
  // A DCS volume type (sphere, axis_box, segment, pyramid), passed as it is; an `area` only as
  // a circle (or a circular manifest zone) without floor or ceiling, searched as a sphere on
  // the ground; any other area is ERROR_CODE_INVALID, as for RemoveJunk.
  Volume volume = 1;
  // Object.Category values to search; empty = units, statics and scenery.
  repeated ObjectCategory categories = 2;
  // At most this many objects are read: 0 = 500, at most 2000. With more in the volume
  // `found.truncated` is set and the rest is not listed.
  uint32 limit = 3;
}

// Object.Category of DCS.
enum ObjectCategory {
  OBJECT_CATEGORY_UNSPECIFIED = 0;
  OBJECT_CATEGORY_UNIT = 1;
  OBJECT_CATEGORY_WEAPON = 2;
  OBJECT_CATEGORY_STATIC = 3;
  OBJECT_CATEGORY_BASE = 4;
  // Map objects: buildings, bridges and other objects of the map. Trees and forests are not
  // listed (forum reports, not measured: OBJ-T32); DCS gives scripts no forest data at all.
  OBJECT_CATEGORY_SCENERY = 5;
  OBJECT_CATEGORY_CARGO = 6;
}

message FoundObjects {
  // In the order DCS handed them over.
  repeated FoundObject objects = 1;
  // The volume held more than `limit` objects; the rest is not listed.
  bool truncated = 2;
}

// One object as DCS answered when the search ran. Fields DCS did not answer stay unset.
message FoundObject {
  ObjectCategory category = 1;
  // The mirror's Eid of a unit, static or cargo it holds; 0 for scenery, weapons, airbases and
  // objects the mirror does not hold.
  uint64 eid = 2;
  // getName(); a scenery object answers its map id as a string.
  string name = 3;
  string type_name = 4;
  Vec3 point = 5;
  // getLife().
  optional double life = 6;
  // getDesc().life: the life of the undamaged object.
  optional double life_max = 7;
  // COALITION_UNSPECIFIED when the object has none (scenery).
  Coalition coalition = 8;
  // The object's `id_` in DCS (a scenery object's map id).
  uint64 dcs_id = 9;
}

// ---- W2: AirbaseControl (API revision 3) ----
// Airbase.autoCapture, Airbase.setCoalition and Airbase.setRadioSilentMode for every listed
// airbase in one DCS frame (one exec op, one pump), each base read before and after
// (getCoalition, autoCaptureIsOn, getRadioSilentMode). Session-bound and keyed like any
// mutating command (a repeat with the key returns the stored answer); lane REALTIME.
// Every selector is resolved against the mirror before anything is sent: an airbase the
// mirror does not hold (an unknown name or ident), a dead one, a base listed twice, no
// setting, or more than 256 bases is ERROR_CODE_INVALID (ERROR_CODE_GONE for a dead base or
// a stale Eid), naming it, and nothing reaches DCS. A failure DCS raises for one base is
// that base's `err`; the others still run, and the command is ok.
// Result: reply.airbase_control, reply.airbases (the bases as the mirror knows them after
// the command: a new owner DCS read back is in the mirror at once), ok = the number of bases
// without an error.
message AirbaseControl {
  // 1..=256 airbases (by Eid, DCS name or manifest ident), each at most once.
  repeated AirbaseSel airbases = 1;
  // The new owner; unset = unchanged. COALITION_UNSPECIFIED is ERROR_CODE_INVALID.
  optional Coalition coalition = 2;
  // DCS's own capture of the base by ground units; unset = unchanged. It is applied before
  // the owner, so a base given to a coalition with `auto_capture = false` stays its own.
  optional bool auto_capture = 3;
  // The base's ATC silent (true) or talking (false); unset = unchanged.
  optional bool radio_silent = 4;
}

message AirbasesControlled {
  // One per requested airbase, in request order.
  repeated AirbaseControlResult bases = 1;
}

message AirbaseControlResult {
  // The mirror's Eid of the airbase (0 when the mirror no longer holds it by that name).
  uint64 eid = 1;
  // The DCS name the command addressed.
  string name = 2;
  // What DCS answered before and after the change; unset when the base was not found when the
  // op ran (then `err` is GONE).
  AirbaseControlState before = 3;
  AirbaseControlState after = 4;
  // Unset = every requested setting was applied; else what DCS raised for this base (GONE:
  // DCS has no such airbase now; LUA_ERROR: a setter raised).
  CommandError err = 5;
}

// The control state of an airbase as DCS answers it. A value DCS did not answer stays unset
// (COALITION_UNSPECIFIED for the owner).
message AirbaseControlState {
  // getCoalition().
  Coalition coalition = 1;
  // autoCaptureIsOn().
  optional bool auto_capture = 2;
  // getRadioSilentMode().
  optional bool radio_silent = 3;
}

// ---- W2: airbase queries (API revision 3) ----
// Reads of airbases: nothing changes in DCS (lane QUERY, no key needed). Each query takes a
// list of airbases (by Eid, DCS name or manifest ident; each at most once) and answers every
// one in request order, or with that base's own `err`: GONE for a base the mirror holds as
// dead or a stale Eid (not sent), or one DCS does not have; LUA_ERROR for a DCS read that
// raised; REJECTED for parking that no longer fits into the answer. A list outside its limit,
// an unset selector, an Eid of another class, an ident the manifest lacks or a base listed
// twice is ERROR_CODE_INVALID for the whole query and nothing reaches DCS.
// Result: reply.airbase_read, reply.airbases; ok = the number of bases without an error.

// Airbase.getParking of 1..=16 airbases. The layer reads at most about 300 spots per pump
// (at least one base) and at most 8000 spots per answer.
message AirbaseParking {
  repeated AirbaseSel airbases = 1;
  // Only the free spots (Airbase.getParking(true)); every listed spot then has taken = false.
  bool available_only = 2;
}

// Airbase.getRunways of 1..=256 airbases (32 bases per pump).
message AirbaseRunways {
  repeated AirbaseSel airbases = 1;
}

// Owner (getCoalition), auto capture (autoCaptureIsOn) and radio silence
// (getRadioSilentMode) of 1..=256 airbases, all read in one DCS frame. An owner DCS reads that
// differs from the mirror's goes into the mirror at once and is one AirbaseOwnerChanged
// (cause DISCOVERED), as a resync snapshot that finds it.
message AirbaseStates {
  repeated AirbaseSel airbases = 1;
}

message AirbasesRead {
  // One per requested airbase, in request order.
  repeated AirbaseRead bases = 1;
}

// One airbase as a query read it. The part of the query is filled; the others stay empty.
message AirbaseRead {
  // The mirror's Eid of the airbase (0 when the mirror does not hold one of that name).
  uint64 eid = 1;
  // Its DCS name (empty for a stale Eid, whose name the mirror no longer knows).
  string name = 2;
  // Unset = DCS answered this base.
  CommandError err = 3;
  // AirbaseStates.
  AirbaseControlState state = 4;
  // AirbaseParking: the spots in the order DCS listed them.
  repeated ParkingSpot parking = 5;
  // AirbaseRunways: the runways in the order DCS listed them (none for a FARP or a ship).
  repeated Runway runways = 6;
}

// Term_Type of a parking spot, by the values the DCS scripting documentation (Hoggit,
// Airbase.getParking) lists; the layer maps DCS's numbers to these names.
enum TerminalType {
  // DCS answered no Term_Type.
  TERMINAL_TYPE_UNSPECIFIED = 0;
  // 16: a spawn point on the runway.
  TERMINAL_TYPE_RUNWAY = 1;
  // 40: helicopters only.
  TERMINAL_TYPE_HELICOPTER_ONLY = 2;
  // 68: a hardened aircraft shelter.
  TERMINAL_TYPE_SHELTER = 3;
  // 72: open or shelter, airplanes only.
  TERMINAL_TYPE_OPEN_OR_SHELTER = 4;
  // 100: a small shelter (Syria and Sinai maps).
  TERMINAL_TYPE_SMALL_SHELTER = 5;
  // 104: open air (generally the larger spots).
  TERMINAL_TYPE_OPEN_AIR = 6;
  // A number this build has no name for; ParkingSpot.terminal_unknown keeps it.
  TERMINAL_TYPE_UNKNOWN = 7;
}

// One parking spot as Airbase.getParking answered. A field DCS did not answer stays unset.
message ParkingSpot {
  // Term_Index: the spot's number at its airbase.
  int32 term_index = 1;
  TerminalType terminal = 2;
  // TERMINAL_TYPE_UNKNOWN: the layer's text for DCS's number, "unknown(<n>)".
  string terminal_unknown = 3;
  // vTerminalPos.
  Vec3 point = 4;
  // Not among the free spots DCS lists (getParking(true)); unset when that read failed.
  optional bool taken = 5;
  // The object DCS named in TO_AC (documented as a boolean; when DCS answers an object it is
  // named here): the mirror's Eid when it holds it, and its DCS name.
  uint64 taken_by = 6;
  string taken_by_name = 7;
  // fDistToRW: to the take-off position of the active runway, metres.
  optional double dist_to_runway = 8;
  // TO_AC as DCS answered it when a boolean (not documented).
  optional bool to_ac = 9;
  // Term_Index_0 as DCS answered it (not documented; -1 in the documentation's example).
  optional int32 term_index_0 = 10;
}

// One runway as Airbase.getRunways answered. A field DCS did not answer stays unset.
message Runway {
  // Name, as text (DCS gives a number such as 8, documented as "can be off").
  string name = 1;
  // course, as DCS gives it: radians, and per the documentation the negative of the true
  // heading ("multiply by -1"; not measured, AWC-T23).
  optional double course = 2;
  // length and width, metres.
  optional double length = 3;
  optional double width = 4;
  // position: the centre of the runway.
  Vec3 center = 5;
}

// ---- W2: warehouse stock (API revision 3) ----
// The stock of 1..=64 warehouses (of an airbase, of a cargo static, or by DCS name; each at
// most once, by its DCS name whatever the selector). A read: nothing changes in DCS or in the
// mirror (lane QUERY, no key needed). Without `items` and `liquids` the whole inventory of each
// warehouse is read (Warehouse.getInventory, a heavy call: one warehouse a pump); with either,
// only those are read (Warehouse.getItemCount of each item, Warehouse.getLiquidAmount of the
// four liquids; 64 such reads a pump), which is cheaper. Every warehouse is answered in request
// order, or with its own `err`: GONE for an airbase or static the mirror holds as dead or a
// stale Eid (not sent), or a warehouse DCS does not have; LUA_ERROR for a DCS read that
// raised; REJECTED for an inventory that no longer fits into the answer (at most 20000 entries
// in all). A list outside its limit, an unset selector, an Eid of another class, an ident the
// manifest lacks, a warehouse listed twice, more than 64 items, an item listed twice or an
// invalid item is ERROR_CODE_INVALID for the whole query and nothing reaches DCS.
// Result: reply.warehouse_stock; ok = the number of warehouses without an error.
message WarehouseStocks {
  repeated WarehouseSel warehouses = 1;
  // Count only these items (getItemCount of each), answered in this order.
  repeated WarehouseItem items = 2;
  // Read the four liquids (getLiquidAmount of each).
  bool liquids = 3;
}

message WarehousesStock {
  // One per requested warehouse, in request order.
  repeated WarehouseStock warehouses = 1;
}

// One warehouse as the query read it. The whole inventory fills `aircraft`, `weapons` and
// `liquids`; `items` and `liquids` of the query fill those; the rest stays unset.
message WarehouseStock {
  // The warehouse as the engine resolved it: an airbase or a static by the mirror's Eid when
  // the mirror holds it alive, else as requested.
  WarehouseSel warehouse = 1;
  // The DCS name of its airbase or static, or the name requested (empty for a stale Eid).
  string name = 2;
  // The mirror's Eid of that airbase or static (0 when the mirror holds none of that name).
  uint64 eid = 3;
  // Unset = DCS answered this warehouse.
  CommandError err = 4;
  StockClass aircraft = 5;
  StockClass weapons = 6;
  LiquidStock liquids = 7;
  // The requested items, in request order.
  repeated ItemCount items = 8;
}

// One class of a warehouse's stock as Warehouse.getInventory listed it.
message StockClass {
  // DCS listed the class as an empty table, which it is reported to do for a class the mission
  // makes unlimited (not measured, AWC-T25; whether a limited class that holds nothing reads
  // the same is not known). `entries` is then empty.
  bool unlimited = 1;
  // What DCS listed, by name.
  repeated StockEntry entries = 2;
}

message StockEntry {
  // The item as DCS names it (the key of getInventory's table, as text).
  string name = 1;
  double count = 2;
}

message LiquidStock {
  // The whole inventory listed the liquids as an empty table (see StockClass.unlimited). Never
  // set by the getLiquidAmount reads of `liquids`, which do not tell.
  bool unlimited = 1;
  // By liquid, in DCS's order (0..3).
  repeated LiquidAmount amounts = 2;
}

message LiquidAmount {
  Liquid liquid = 1;
  // LIQUID_UNKNOWN: the layer's text for DCS's key, "unknown(<key>)".
  string unknown = 2;
  // As DCS answered it. DCS documents no unit; kilograms are assumed (the mission editor gives
  // the initial amounts in tons; not measured, AWC-T25).
  double amount = 3;
  // The amount is above 2^29 (see ItemCount.unlimited).
  bool unlimited = 4;
}

message ItemCount {
  // As requested.
  WarehouseItem item = 1;
  // Warehouse.getItemCount as DCS answered it; unset when DCS answered no number.
  optional double count = 2;
  // The count is above 2^29: DCS is reported to answer an unlimited stock with a huge count
  // (2^29 is the mark MOOSE uses; not measured, AWC-T25). This read alone cannot tell an
  // unlimited class that DCS answers with a small number: the whole inventory types the class.
  bool unlimited = 3;
}

// ---- W2: WarehouseOp (API revision 3) ----
// Changes of the stock of warehouses (of an airbase, of a cargo static, or by DCS name): set an
// item or a liquid to an amount, add to it, remove from it, or move an amount from one warehouse
// to another; 1..=16 changes, in request order, all in one DCS frame (one exec op, one pump).
// Session-bound and mutating; lane REALTIME. Add, remove and transfer are not idempotent: an
// engine that requires keys (sortied --dev, --require-keys) refuses a WarehouseOp holding one
// of them without a key (a WarehouseOp of `set` changes only needs none); a repeat with the key
// returns the stored answer, whether or not the changes were applied.
// All or nothing. In that frame the layer first finds every warehouse and reads every count the
// changes touch, and checks each change in order against the counts the changes before it
// leave: a warehouse DCS has, a stock that is not unlimited, enough stock for a remove or a
// transfer. If any change fails its check, nothing is changed. Else it applies the changes in
// order and reads each count back; a DCS function that raises, or a count that does not move as
// asked, stops there, and the changes already made are undone (each count set back to what it
// was before them) as far as DCS lets the layer.
// Every selector is resolved against the mirror before anything is sent: a warehouse the mirror
// does not hold (an unknown name or ident), an unset selector, item, liquid or change, an amount
// outside its range, a transfer to its own warehouse, no change or more than 16 is
// ERROR_CODE_INVALID (ERROR_CODE_GONE for an airbase or static the mirror holds as dead, or a
// stale Eid), naming the change, and nothing reaches DCS.
// Result: reply.warehouse_op; ok = the number of changes applied (0 when `applied` is false).
// The command is ok whenever the layer ran it, whether or not the changes were applied.
message WarehouseOp {
  repeated StockChange changes = 1;
}

// One change of one item or liquid of one warehouse.
message StockChange {
  // The warehouse changed; for a transfer, the one the stock leaves.
  WarehouseSel warehouse = 1;
  // An item (Warehouse.setItem, addItem, removeItem) or a liquid (setLiquidAmount, addLiquid,
  // removeLiquid; LIQUID_UNSPECIFIED and LIQUID_UNKNOWN are ERROR_CODE_INVALID).
  oneof stock {
    WarehouseItem item = 2;
    Liquid liquid = 3;
  }
  // An item is counted in whole numbers up to 1000000, a liquid in amounts up to 100000000
  // (kilograms assumed); `set` takes 0 too, add, remove and transfer more than 0.
  oneof change {
    // Set the count or amount to this.
    double set = 4;
    double add = 5;
    // More than the warehouse holds is refused (NOT_ENOUGH), never clamped at zero.
    double remove = 6;
    StockTransfer transfer = 7;
  }
}

// Move `amount` from StockChange.warehouse to `to`: removed there and added here in the same
// frame, or not at all.
message StockTransfer {
  // Another warehouse than StockChange.warehouse.
  WarehouseSel to = 1;
  double amount = 2;
}

message StockChanges {
  // Every change was applied. False: none is (each change's `outcome` says why), unless
  // `undo_failed`.
  bool applied = 1;
  // A change failed while the changes were applied, and the undo did not bring every count
  // back: the stock is as the `after` of each side says.
  bool undo_failed = 2;
  // One per requested change, in request order.
  repeated StockChanged changes = 3;
}

// What WarehouseOp did with one change.
message StockChanged {
  StockOutcome outcome = 1;
  // Why, for every outcome but DONE: the DCS function that raised and what it raised, the
  // count that was short, the change that failed.
  string message = 2;
  // The warehouse changed; for a transfer, the one the stock left.
  StockSide warehouse = 3;
  // A transfer: the warehouse the stock went to.
  StockSide to = 4;
}

// One warehouse of a change: which one, and its counts of the item or liquid.
message StockSide {
  // As the engine resolved it: an airbase or a static by the mirror's Eid when the mirror holds
  // it alive, else as requested.
  WarehouseSel warehouse = 1;
  // The DCS name of its airbase or static, or the name requested.
  string name = 2;
  // The mirror's Eid of that airbase or static (0 when the mirror holds none of that name).
  uint64 eid = 3;
  // The count this change starts from: what DCS read before the command, moved by the changes
  // before this one. Unset when the warehouse was not found or the read failed.
  optional double before = 4;
  // What DCS read after this change (after the undo for UNDONE and UNDO_FAILED, and for the
  // change that failed while applying); unset when the change, or this side of it, did not run
  // (an ALIASED side).
  optional double after = 5;
  // DCS answered a count above 2^29, which it is reported to answer for an unlimited stock
  // (not measured, AWC-T26).
  bool unlimited = 6;
}

enum StockOutcome {
  STOCK_OUTCOME_UNSPECIFIED = 0;
  // Applied: `after` is what DCS read back.
  STOCK_OUTCOME_DONE = 1;
  // This change passed its check, but another change of the command did not: nothing was
  // changed.
  STOCK_OUTCOME_NOT_APPLIED = 2;
  // Applied and undone again, because a later change failed while the changes were applied.
  STOCK_OUTCOME_UNDONE = 3;
  // Applied, and the undo after a later failure did not bring its count back (DCS raised, or
  // read back another count): the stock stays as `after` says.
  STOCK_OUTCOME_UNDO_FAILED = 4;
  // The stock is unlimited: DCS answered a count above 2^29 (on either side of a transfer). DCS
  // is reported to change nothing on an unlimited stock (AWC-T6, not measured), so the change is
  // refused before anything is changed.
  STOCK_OUTCOME_UNLIMITED = 5;
  // A remove or a transfer of more than the warehouse holds (after the changes before it).
  STOCK_OUTCOME_NOT_ENOUGH = 6;
  // DCS has no such warehouse now.
  STOCK_OUTCOME_GONE = 7;
  // A DCS read or change raised (`message` names the function).
  STOCK_OUTCOME_DCS_ERROR = 8;
  // DCS did not change the count as asked (the count read back is not what the change gives),
  // as an unlimited stock that DCS answers with a small count would do (not measured, AWC-T26).
  // The changes made before it were undone.
  STOCK_OUTCOME_UNCHANGED = 9;
  // When its turn came the count was not what the check left for it: an earlier change of the
  // command moved it under another form of the item (its name and its wsType, or two names DCS
  // counts as one stock), which the check counted apart. This change did not run; the changes
  // made before it were undone. Name an item in one form per command.
  STOCK_OUTCOME_ALIASED = 10;
}

// ---- W2: item names (API revision 3) ----
// The names DCS gives the objects it knows and the wsType of each, as DCS answers
// Warehouse.getResourceMap() at runtime (documented since DCS 2.8.8: "the wsType of every object
// that exists in DCS", by name, e.g. ["weapons.missiles.P_24T"] = {4, 4, 7, 26}; aircraft and
// other units by their type name). A weapon's name there is the name the Warehouse functions and
// getInventory use (not measured, AWC-T27). A read: nothing changes in DCS or in the mirror
// (lane QUERY, no key needed). The engine asks DCS once per DCS process and DCS version and
// answers later queries from what it keeps in memory (`cached`); nothing is written to disk.
// Reading the map is heavy: DCS builds it in one call, the layer copies it over several pumps,
// and no other heavy job runs meanwhile. Without `items` every name is answered; with them, only
// the matching ones. More than 64 items, an unset or invalid item, or an item listed twice is
// ERROR_CODE_INVALID and nothing reaches DCS; a DCS without Warehouse.getResourceMap is
// ERROR_CODE_UNAVAILABLE (capability `item_names` MISSING_IN_DCS).
// Result: reply.item_names; ok = the number of names answered.
message ItemNames {
  // Look up only these: a name gives its entry, a wsType every entry that has it (several names
  // may share one). Unmatched ones are answered in ItemNameList.unknown.
  repeated WarehouseItem items = 1;
}

message ItemNameList {
  // The names answered, sorted by name, each once.
  repeated ItemName names = 1;
  // The requested items DCS has no entry for, in request order.
  repeated WarehouseItem unknown = 2;
  // How many names DCS's map holds (whatever `items` asked).
  uint32 total = 3;
  // Entries of DCS's map the layer left out: a key that is no name, or a value that is not four
  // whole numbers.
  uint32 skipped = 4;
  // The DCS version of the mission link that read the map.
  string dcs_version = 5;
  // Answered from what the engine kept of an earlier read in the same DCS process.
  bool cached = 6;
  // How the layer called DCS: "Warehouse.getResourceMap()", or
  // "Warehouse.getResourceMap(<warehouse>)" when only the call with a warehouse answered.
  string source = 7;
}

message ItemName {
  // As DCS names it: "weapons.missiles.AIM_120C", an aircraft type such as "F-16C_50".
  string name = 1;
  // Unset when DCS gives {0, 0, 0, 0}, which it gives shells, statics and turrets alike (no item
  // type: a warehouse cannot be asked for it).
  WsType ws_type = 2;
}

// Hooks-environment server control (LANE_CONTROL).
message ServerControl {
  oneof action {
    SetPause set_pause = 1;
    LoadMission load_mission = 2;
    SendChat send_chat = 3;
  }
}

message SetPause {
  bool paused = 1;
}

message LoadMission {
  // Absolute path of a .miz the engine registered (under <writedir>/Missions/Sortie/).
  string path = 1;
}

message SendChat {
  string text = 1;
}

// Execute Lua. Only accepted when the engine runs with --dev-eval.
message DevEval {
  string code = 1;
  Env env = 2;
}

// =====================================================================================
// W1: the universal call (spec, section 2). A logic calls one DCS function of the DCS API
// catalog (`catalog/dcs_api.toml`) by its Lua path, with data arguments. The engine checks
// the call against the catalog entry (path, environment, receiver class, argument types,
// class, guards, limits) before anything reaches DCS. Nothing here is ever compiled: no Lua
// source, no callback, no file-system path. (CallClass is declared in common.proto next to
// Capability, which reports it.)
// =====================================================================================

// A reference to a live DCS object: the receiver of a method, or an argument.
// An unset `target` is ERROR_CODE_INVALID. An Eid of the wrong class for the member
// (a group Eid in `object`, an entity Eid in `group`) is ERROR_CODE_INVALID.
message DcsRef {
  oneof target {
    ObjSel object = 1;
    GroupSel group = 2;
    AirbaseSel airbase = 3;
    // Group:getController() / Unit:getController(), derived again on every call.
    ControllerSel controller = 4;
    // Airbase:getWarehouse(), Warehouse.getCargoAsWarehouse or Warehouse.getByName, derived
    // again on every call.
    WarehouseSel warehouse = 5;
    // Opaque handle from an earlier DcsReturn (ObjectRef.handle). Only objects that have
    // no selector get one (a Spot made by a call, unknown userdata). The Lua layer keeps the
    // object with its class and checks it again before every use. Unknown, dropped, or from
    // another session or environment: ERROR_CODE_GONE.
    uint64 handle = 6;
    // DcsBatch only: the first return value of an earlier call of the same batch (0-based
    // index into DcsBatch.calls), which must be a DCS object. If that call failed or was
    // skipped, this call is skipped too.
    uint32 result_of = 7;
  }
}

// One argument. The Lua layer builds the Lua value; nothing here is ever compiled.
// An unset `kind` is ERROR_CODE_INVALID (nil is `value` holding LuaNil). Numbers are
// checked before anything is sent: NaN and infinities are ERROR_CODE_INVALID. The kind
// must fit the type the catalog entry declares for the argument.
message DcsArg {
  oneof kind {
    // nil, boolean, number, string or a plain data table.
    LuaValue value = 1;
    // The DCS object itself (a Unit, Group, Airbase, Controller, Warehouse, ...).
    DcsRef object = 2;
    // The DCS numeric id of the object (Group:getID, Unit:getID, StaticObject:getID,
    // Airbase:getID), read in the Lua layer at execution time.
    DcsRef id_of = 3;
    // The DCS name of the object (getName), read at execution time.
    DcsRef name_of = 4;
    // A DCS enum value by its full Lua path, e.g. "trigger.smokeColor.Red",
    // "country.id.USA". The table must be the one the catalog entry names for the
    // argument; the Lua layer resolves the key, a missing key is ERROR_CODE_INVALID.
    string enum_key = 5;
    // The coalition in the form the catalog entry declares for this argument:
    // `side_number` (the coalition.side number) or `side_name` ("red" / "blue" /
    // "neutrals", the form some hooks functions take).
    Coalition coalition = 6;
    // {x=, y=, z=} in runtime axes.
    Vec3 vec3 = 7;
    // {x = north, y = east} (the 2D form DCS uses for map points).
    MapPoint vec2 = 8;
    // The hooks-environment player id of the player.
    PlayerSel player = 9;
    // A table whose values may themselves be object refs, ids, enum keys or points.
    DcsTable table = 10;
  }
}

message DcsTable {
  repeated DcsField fields = 1;
}

message DcsField {
  oneof slot {
    string key = 1;
    // 1-based array index.
    uint32 index = 2;
  }
  DcsArg value = 3;
}

// Call one DCS function of the catalog. Never Lua source.
// Result: reply.call (typed) and ok = the first return value when it is plain data
// (nil otherwise: an object or a table that holds objects is in reply.call only).
// A READ call takes no idempotency key (a stored read would be stale: ERROR_CODE_INVALID);
// a mutating call repeats its effect unless keyed.
message DcsCall {
  // Lua path of the function: "land.getHeight", "trigger.action.explosion",
  // "net.get_player_list", or "<Class>.<method>" for a method: "Unit.getFuel",
  // "Airbase.getParking". An inherited method may be named through any class that has it
  // ("Airbase.getPoint"); the engine resolves it to the defining class ("Object.getPoint"),
  // which is the name of its catalog entry and capability.
  // Grammar: name("." name){1,3}, name = [A-Za-z_][A-Za-z0-9_]*, at most 96 bytes.
  string path = 1;
  // UNSPECIFIED = the environment of the catalog entry. A path listed for both
  // environments needs it set.
  Env env = 2;
  // Method receiver; unset for plain functions. Its DCS class must be the class the
  // catalog entry names or one that inherits from it.
  DcsRef receiver = 3;
  repeated DcsArg args = 4;
  // Depth to which returned tables are copied. 0 = 6, at most 12. A deeper table is
  // returned as DcsValue.cut and DcsReturn.truncated is set.
  uint32 max_depth = 5;
}

// Several calls executed in order in one simulation frame (one pump of one environment).
// All calls must belong to the same environment. The engine validates the whole batch
// before it sends anything: an unlisted or disabled path, a bad argument, a guard or a
// rate limit fails the command and no call runs (a limit sets CommandError.limit, 0.4.0).
// Result: reply.batch.
message DcsBatch {
  repeated DcsCall calls = 1;
  // true: the first failing call stops the batch; the rest are reported `skipped`.
  // false: every call runs.
  bool stop_on_error = 2;
  // true: when a call failed, the CommandResult is that call's error (reply.batch is
  // still filled), so `after` chains stop and nothing is stored under the key.
  // false: the command is `ok` and the caller reads the per-call outcomes.
  bool fail_command_on_error = 3;
}

enum ObjectClass {
  OBJECT_CLASS_UNSPECIFIED = 0;
  OBJECT_CLASS_UNIT = 1;
  OBJECT_CLASS_STATIC = 2;
  OBJECT_CLASS_WEAPON = 3;
  OBJECT_CLASS_SCENERY = 4;
  OBJECT_CLASS_CARGO = 5;
  OBJECT_CLASS_AIRBASE = 6;
  OBJECT_CLASS_GROUP = 7;
  OBJECT_CLASS_CONTROLLER = 8;
  OBJECT_CLASS_WAREHOUSE = 9;
  OBJECT_CLASS_SPOT = 10;
  OBJECT_CLASS_OTHER = 11;
}

// A DCS object that a call returned.
message ObjectRef {
  ObjectClass object_class = 1;
  // Set when the mirror tracks the object. 0 with `name` set: the object came back as a
  // light reference and was not resolved in this result (per-call cap, spec 2.4); the
  // next sweep observes it.
  uint64 eid = 2;
  string name = 3;
  string type_name = 4;
  // Only for objects without a selector (see DcsRef.handle); 0 otherwise.
  uint64 handle = 5;
  // A returned Controller or Warehouse comes back as the selector that derives it again
  // (usable as DcsRef.controller / DcsRef.warehouse). No handle is kept for these.
  ControllerSel controller = 6;
  WarehouseSel warehouse = 7;
  oneof snap {
    EntitySnap entity = 10;
    GroupSnap group = 11;
    AirbaseSnap airbase = 12;
    WeaponSnap weapon = 13;
  }
}

// One returned value as a typed tree. Nothing is marked in-band, so data that DCS returns
// (mission-authored tables included) can never be mistaken for a reference or a cut.
message DcsValue {
  oneof kind {
    LuaNil nil = 1;
    bool boolean = 2;
    double number = 3;
    string string = 4;
    DcsValueTable table = 5;
    // A DCS object: 0-based index into DcsReturn.refs.
    uint32 ref = 6;
    // A number of an enum the catalog entry names, replaced by the key name.
    string enum_key = 7;
    // A table cut by the depth or size limit: the number of keys it had.
    uint32 cut = 8;
  }
}

// Ordered pairs; arrays use number keys 1..n in order (as LuaTable).
message DcsValueTable {
  repeated DcsValuePair pairs = 1;
}

message DcsValuePair {
  DcsValue key = 1;
  DcsValue value = 2;
}

message DcsReturn {
  // Every return value in order.
  repeated DcsValue values = 1;
  repeated ObjectRef refs = 2;
  CallClass call_class = 3;
  // A size or depth limit cut the values (DcsValue.cut), or a function or thread was dropped.
  bool truncated = 4;
}

message DcsCallResult {
  // Both unset when `skipped`.
  oneof outcome {
    DcsReturn ok = 1;
    CommandError err = 2;
  }
  uint32 cost_us = 3;
  // The call did not run: an earlier call failed (stop_on_error) or its result_of
  // reference had no object.
  bool skipped = 4;
}

message DcsBatchReturn {
  // One per call, in call order.
  repeated DcsCallResult results = 1;
}
