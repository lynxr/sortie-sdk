// Mission logic programs <-> engine. The SDK speaks only this stream, whether over gRPC
// (sortie::connect) or in-process (FakeDcs / Engine::attach_logic).
syntax = "proto3";

package sortie.v1;

import "sortie/manifest/v1/manifest.proto";
import "sortie/v1/commands.proto";
import "sortie/v1/common.proto";
import "sortie/v1/events.proto";
import "sortie/v1/state.proto";
import "sortie/v1/world.proto";

service Logic {
  rpc Attach(stream LogicUp) returns (stream LogicDown);
}

message LogicUp {
  oneof msg {
    // Must be the first message on the stream.
    Attach attach = 1;
    TickDone done = 2;
    Command command = 3;
    StateOp state = 4;
    // The replica no longer matches the tick deltas; the engine answers with LogicDown.resync.
    Resync resync = 5;
    // 6 is kept for M4 (LogicFault fault).
    // API revision 3. The actions of the web API this logic answers now: the whole set each
    // time (an empty list declares none). Declarations end with the stream.
    ActionSet actions = 7;
    // API revision 3. The answer to LogicDown.action with the same id; one per call.
    ActionReply action_reply = 8;
  }
}

message Resync {
  // Revision of the replica when it noticed the gap.
  uint64 have_rev = 1;
  // Human-readable cause, logged by the engine.
  string reason = 2;
}

enum Mode {
  MODE_UNSPECIFIED = 0;
  // Owns the session: commands go to DCS.
  MODE_PRIMARY = 1;
  // Hot reload candidate: keyed commands with stored results return them, other commands
  // wait for Promote. (Hot reload lands in M4; until then STANDBY is rejected.)
  MODE_STANDBY = 2;
  // Read-only: receives Start/Tick/Event, commands are rejected.
  MODE_OBSERVER = 3;
}

message Attach {
  // Logic program name (crate/binary name).
  string logic = 1;
  // Build id of the logic binary (free-form, e.g. git describe + profile).
  string build_id = 2;
  // Raw 32 bytes of the scenario schema hash the logic was compiled against
  // (hex-decoded Scenario::SCHEMA_SHA256 / scenario.lock.json "schema_sha256").
  bytes scenario_schema_sha256 = 3;
  // Every symbol the logic was compiled with, as "<kind>:<IDENT>", e.g. "group:SAM_NORTH".
  repeated string symbols_used = 4;
  Mode mode = 5;
  // Scenario name, e.g. "op_north". Sessions of other scenarios are not delivered.
  string scenario = 6;
  // Scenario schema number from the lock file.
  uint32 schema = 7;
  // W1. Event revision the logic declares (written in the logic's source, not chosen by
  // the SDK version). 0 = the 0.1.0 event set and behaviour. The engine never sends an
  // event kind, and never applies an event behaviour change, newer than this revision.
  // Must not be higher than api_rev (ERROR_CODE_INVALID).
  uint32 event_rev = 8;
  // 9 is kept for W4 (mute_kinds), 12 for W4 (hit_merge_s).
  // W1. API revision the logic declares (0 = 0.1.0, 1 = wave 1, ...). Command and world
  // behaviour that differs from 0.1.0 is applied only from the revision that introduced
  // it. It selects behaviour and wire projections, never what the mirror holds.
  uint32 api_rev = 10;
  // W1. Capabilities the logic cannot run without ("spawn_static", "draw",
  // "call:mission:Airbase.setCoalition", ...), collected by the SDK from the logic's
  // declarations. If one is not AVAILABLE the engine refuses the attach
  // (AttachRejected.missing_capabilities) instead of failing later in a rare code path.
  repeated string required_capabilities = 11;
}

message LogicDown {
  oneof msg {
    Start start = 1;
    Tick tick = 2;
    Event event = 3;
    CommandResult result = 4;
    Promote promote = 5;
    Shutdown shutdown = 6;
    SessionEnded ended = 7;
    StateResult state = 8;
    // Attach refused (schema mismatch, unknown scenario, bad mode, ...). The stream ends.
    AttachRejected rejected = 9;
    // A full replica of the running session, sent after LogicUp.resync (or when the engine can
    // no longer build a delta for this logic). The logic replaces its replica; later ticks
    // continue from snapshot.rev.
    WorldSnapshot resync = 10;
    // API revision 3. A web caller called an action this logic declared
    // (POST /api/v1/actions/<logic>/<name>); answer with LogicUp.action_reply.
    ActionCall action = 11;
  }
}

enum StartKind {
  START_KIND_UNSPECIFIED = 0;
  START_KIND_FRESH = 1;
  START_KIND_RESTART = 2;
  START_KIND_AFTER_CRASH = 3;
  START_KIND_RESUMED = 4;
}

// Sent when a session of the attached scenario is ready (the world was reconciled with the
// manifest). A logic stays attached across sessions: one Start per session.
message Start {
  string session = 1;
  StartKind kind = 2;
  sortie.manifest.v1.Manifest manifest = 3;
  WorldSnapshot snapshot = 4;
  // Campaign turn key (= build_id of the running mission); scopes once_per_turn markers.
  string turn = 5;
  double model_time = 6;
  // W1. What this engine and the running DCS build support (same data as
  // Engine.Capabilities at the time of Start). Later changes arrive as CapabilityChanged.
  repeated Capability capabilities = 7;
  // W1. API revision of the engine. Absent (0) = a 0.1.0 engine: the SDK then refuses
  // locally every operation newer than 0.1.0 (the engine could not even see its fields).
  uint32 api_rev = 8;
  // W1. The event revision in effect: min(Attach.event_rev, what the engine serves).
  uint32 event_rev = 9;
  // W1. The name this logic writes under (ResourceSnap.owner, rate limits): the name of
  // its API token, or Attach.logic on an engine without tokens.
  string writer = 10;
}

// 10 Hz while the session runs (stops while paused, except one Tick with paused = true).
message Tick {
  uint64 n = 1;
  double model_time = 2;
  WorldDelta delta = 3;
  bool paused = 4;
}

message TickDone {
  uint64 n = 1;
}

message Promote {}

message Shutdown {
  string reason = 1;
}

enum EndReason {
  END_REASON_UNSPECIFIED = 0;
  // The logic called ctx.end_session(outcome).
  END_REASON_LOGIC = 1;
  // The manifest time limit expired.
  END_REASON_TIME_LIMIT = 2;
  // Missions.Restart or a new mission load.
  END_REASON_RESTART = 3;
  // DCS unloaded the mission (onSimulationStop) without an outcome.
  END_REASON_MISSION_UNLOADED = 4;
  // The engine is shutting down.
  END_REASON_ENGINE_SHUTDOWN = 5;
}

message SessionEnded {
  string session = 1;
  Outcome outcome = 2;
  string text = 3;
  EndReason reason = 4;
}

message AttachRejected {
  ErrorCode code = 1;
  string message = 2;
  // Symbols the logic needs that the running manifest lacks (or declares with another kind).
  repeated string missing_symbols = 3;
  // W1. Entries of Attach.required_capabilities that are not AVAILABLE, with their state.
  repeated Capability missing_capabilities = 4;
}

// State documents, once markers, timers, the session report and the documents of the web API,
// multiplexed on the stream.
message StateOp {
  // Client-chosen correlation id, unique per stream.
  uint64 id = 1;
  oneof op {
    StateGet get = 2;
    StatePut put = 3;
    OnceCheck once_check = 4;
    OnceMark once_mark = 5;
    TimerArm timer_arm = 6;
    ReportSet report_set = 7;
    // API revision 3. Answered with StateResult.published; needs no session.
    PublishDoc publish = 8;
    // API revision 3. Answered with StateResult.published (rev 0: nothing was published).
    UnpublishDoc unpublish = 9;
  }
}

// ---- API revision 3: documents of the web API ----
// A logic publishes named JSON documents; the engine stores them under the logic's name
// (Attach.logic) and serves them read-only over HTTP (GET /api/v1/docs/<logic>/<name>). They
// outlive the logic process, the session and the engine (the state database). Requests never
// reach the logic or DCS.
message PublishDoc {
  // 1 to 64 bytes of a-z, 0-9, `_` and `-`.
  string name = 1;
  // UTF-8 JSON (any JSON value), at most 256 KiB. The same bytes again change nothing.
  bytes json = 2;
}

message UnpublishDoc {
  string name = 1;
}

message PublishedDoc {
  // The logic it belongs to (Attach.logic) and its name.
  string logic = 1;
  string name = 2;
  // The engine-wide number of the change that stored it: it grows with every publish of any
  // document of this engine, so one rev is one content. 0 = not published (an unpublish of
  // nothing).
  uint64 rev = 3;
  // Wall time of that change, milliseconds since 1970-01-01 UTC.
  int64 updated_unix_ms = 4;
  // This op stored new content (publish) or removed a document (unpublish).
  bool changed = 5;
}

// ---- API revision 3: actions of the web API ----
// A logic declares named actions; a web caller (role operator or admin) calls one with
// POST /api/v1/actions/<logic>/<name> and a JSON body; the engine hands the call to the logic
// that declared it (LogicDown.action) and answers the caller with the logic's answer
// (LogicUp.action_reply). The logic decides what happens in the game; the caller never sends
// DCS commands. No answer within 10 s is 504.
message ActionSet {
  // 1 to 64 bytes of a-z, 0-9, `_` and `-` each; at most 64 names. The logic's own name
  // (Attach.logic) is a path segment: 1 to 64 bytes of A-Z, a-z, 0-9, `.`, `_` and `-`.
  repeated string names = 1;
}

message ActionCall {
  // Chosen by the engine, unique per stream; the answer names it.
  uint64 id = 1;
  // The action called (one of ActionSet.names).
  string name = 2;
  // The request body: UTF-8 JSON (`null` for an empty body), at most [http] max_body_bytes.
  bytes json = 3;
  // The name of the caller's API token ("" without a token or without a name).
  string token = 4;
  // The caller's role: "operator" or "admin".
  string role = 5;
}

message ActionReply {
  // ActionCall.id.
  uint64 id = 1;
  oneof answer {
    // HTTP 200 with this body: UTF-8 JSON, at most 1 MiB.
    bytes json = 2;
    // A refusal by the logic: HTTP 400 to 499.
    ActionRefusal refused = 3;
    // The logic gave no answer (the request was dropped, or its answer could not be
    // written): HTTP 500 with this text.
    string unanswered = 4;
  }
}

message ActionRefusal {
  // 400 to 499.
  uint32 status = 1;
  string message = 2;
}

message StateGet {
  StateScope scope = 1;
  string name = 2;
}

message StatePut {
  StateScope scope = 1;
  string name = 2;
  uint64 expected_revision = 3;
  bytes json = 4;
}

// Is the once marker `name` already set? (scope SESSION for ctx.once, TURN for once_per_turn)
message OnceCheck {
  StateScope scope = 1;
  string name = 2;
}

message OnceMark {
  StateScope scope = 1;
  string name = 2;
}

// Arm (or look up) the named session timer. The first arm stores
// deadline = model_time + duration_s; later arms with the same name return the stored deadline.
message TimerArm {
  string name = 1;
  double duration_s = 2;
}

// Put a value into the session report (MissionResults.report_json).
message ReportSet {
  string key = 1;
  string value_json = 2;
}

message StateResult {
  uint64 id = 1;
  oneof result {
    // StateGet / StatePut (after a put: the stored document with its new revision).
    StateDoc doc = 2;
    OnceStatus once = 3;
    TimerStatus timer = 4;
    StateAck ack = 5;
    // API revision 3: PublishDoc / UnpublishDoc.
    PublishedDoc published = 6;
    CommandError err = 9;
  }
}

message OnceStatus {
  bool done = 1;
}

message TimerStatus {
  // Model time at which the timer fires.
  double deadline = 1;
}

message StateAck {}
