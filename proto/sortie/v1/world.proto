// World mirror: snapshots, deltas and the World service.
syntax = "proto3";

package sortie.v1;

import "google/protobuf/field_mask.proto";
import "sortie/v1/common.proto";
import "sortie/v1/resources.proto";

service World {
  // Full snapshot of the current (or named) session's world.
  rpc GetSnapshot(GetSnapshotRequest) returns (WorldSnapshot);
  // Deltas from `from_revision` (0 = start with one delta carrying everything).
  rpc Subscribe(SubscribeWorldRequest) returns (stream WorldDelta);
}

// One object (unit, static, weapon, ...) as known by the engine at a point in time.
// Participants of events are EntitySnaps, so nobody needs to ask DCS about a dead object.
message EntitySnap {
  uint64 eid = 1;
  string name = 2;
  string type_name = 3;
  Coalition coalition = 4;
  Category category = 5;
  optional Vec3 pos = 6;
  optional string player = 7;
  optional uint64 group_eid = 8;
  // DCS country key as in the country.id table, e.g. "RUSSIA", "USA".
  string country = 9;
  optional Vec3 velocity = 10;
  optional double heading_rad = 11;
  // false while the object is alive (proto3 default), true after DEAD/UNIT_LOST/KILL/gone.
  bool dead = 12;
  // DCS object handle (`id_`) at the time of the snapshot; 0 if unknown. Informational:
  // DCS reuses these, clients must key on eid.
  uint32 runtime_id = 13;
  // Unit:getID() for units, 0 otherwise.
  uint32 unit_id = 14;
  string group_name = 15;
  // Unit:getLife() if sampled, 0 if unknown.
  double life = 16;
}

message GroupSnap {
  uint64 eid = 1;
  string name = 2;
  // Manifest symbol (e.g. "SAM_NORTH") when the group comes from the manifest, else empty.
  string ident = 3;
  Coalition coalition = 4;
  Category category = 5;
  // Unit eids in DCS order.
  repeated uint64 units = 6;
  // Group:getID(), 0 if unknown.
  uint32 group_id = 7;
  string country = 8;
}

message AirbaseSnap {
  uint64 eid = 1;
  string name = 2;
  // Manifest symbol (e.g. "MAYKOP_KHANSKAYA") when declared in the manifest, else empty.
  string ident = 3;
  Coalition coalition = 4;
  Vec3 pos = 5;
  // Airbase:getID() (airdromeId for airfields).
  uint32 airbase_id = 6;
  // 7..10 and 13..16 are kept for W2 (kind, type_name, callsign, country, ...).
  // W1. Eid of the entity that carries the base: the FARP static, the ship unit.
  // 0 = an airfield of the map (or a host the mirror has not linked yet).
  uint64 host_eid = 11;
  // W1. The host is destroyed or sunk. A dead base is not found by name any more.
  bool dead = 12;
}

message WeaponSnap {
  // W1: assigned for every client (0.1.0 always sent 0). One Eid from the first event
  // that names the weapon (SHOT) to its last (HIT, KILL); usable as ObjSel.eid while the
  // weapon exists. 0: the event named no weapon object (weapon_name only, or a unit in a
  // collision HIT). Weapons are no world entities.
  uint64 eid = 1;
  string type_name = 2;
  string name = 3;
  optional Vec3 pos = 4;
}

message WorldSnapshot {
  string session = 1;
  // Revision the snapshot corresponds to; deltas continue from here.
  uint64 rev = 2;
  double model_time = 3;
  repeated GroupSnap groups = 4;
  repeated EntitySnap entities = 5;
  repeated AirbaseSnap airbases = 6;
  // W1. The resource registry of the session (drawings, ... by kind, then name). After an
  // attach or a resync this is the truth: what is listed exists, what is not is gone.
  repeated ResourceSnap resources = 7;
}

// Changes between two revisions. Upserts carry the full current EntitySnap.
message WorldDelta {
  uint64 from_rev = 1;
  uint64 rev = 2;
  double model_time = 3;
  repeated EntitySnap upserts = 4;
  // Eids removed from the world (no longer tracked at all).
  repeated uint64 removals = 5;
  repeated GroupSnap group_upserts = 6;
  repeated uint64 group_removals = 7;
  repeated AirbaseSnap airbase_upserts = 8;
  // W1. Registry changes: every put that changed a ResourceSnap field (also a ttl that
  // started again), and the removals. A consumer applies resource_removals first, then
  // resource_upserts.
  repeated ResourceSnap resource_upserts = 9;
  repeated ResourceKey resource_removals = 10;
  // 11..26 are assigned to waves 2..6 (spec, section 8.2).
  // W1. Airbase Eids removed from the world (a destroyed FARP: sent in the revision that
  // removes its static). Airbase names can be used again by a later spawn.
  repeated uint64 airbase_removals = 27;
}

message GetSnapshotRequest {
  // Empty = current session.
  string session = 1;
  // W1. API revision the caller was built for; 0 = 0.1.0. It selects how the answer is
  // projected (enum values newer than the revision are downgraded, spec 8.1); it never
  // changes what the mirror holds.
  uint32 api_rev = 2;
}

message WorldQuery {
  repeated Coalition coalitions = 1;
  repeated Category categories = 2;
  repeated string group_names = 3;
  // Manifest zone idents; an entity matches if it is inside any of them.
  repeated string zones = 4;
  bool players_only = 5;
}

message SubscribeWorldRequest {
  string session = 1;
  uint64 from_revision = 2;
  WorldQuery query = 3;
  // EntitySnap fields to fill; empty = all.
  google.protobuf.FieldMask field_mask = 4;
  // W1. As GetSnapshotRequest.api_rev.
  uint32 api_rev = 5;
}
