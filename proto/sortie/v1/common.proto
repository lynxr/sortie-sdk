// Shared vocabulary of the public Sortie API (package sortie.v1).
//
// Rules for every file under proto/sortie/v1:
// - changes are additive only (buf breaking runs in CI); a breaking change means sortie.v2;
// - every enum starts with <ENUM>_UNSPECIFIED = 0 and prefixes its values;
// - DCS numbers never appear here: the engine (DcsCodec) translates them using the
//   number tables the bridge captures at mission start;
// - entity ids are Eids: uint64 = generation << 32 | index, 0 means "none".
syntax = "proto3";

package sortie.v1;

// A point in DCS runtime axes: x = north (m), y = up (m, above sea level), z = east (m).
// Note: in mission-editor tables "y" is east; Vec3 always uses the runtime convention.
message Vec3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

// A 2D map point with explicit names (editor x = north, editor y = east), in metres.
message MapPoint {
  double north = 1;
  double east = 2;
}

// WGS84 latitude/longitude in degrees.
message LatLon {
  double lat = 1;
  double lon = 2;
}

enum Coalition {
  COALITION_UNSPECIFIED = 0;
  COALITION_NEUTRAL = 1;
  COALITION_RED = 2;
  COALITION_BLUE = 3;
}

// Object category, normalised from DCS Object.Category (class) and Unit.Category (desc).
enum Category {
  CATEGORY_UNSPECIFIED = 0;
  CATEGORY_AIRPLANE = 1;
  CATEGORY_HELICOPTER = 2;
  CATEGORY_GROUND_UNIT = 3;
  CATEGORY_SHIP = 4;
  CATEGORY_STRUCTURE = 5;
  CATEGORY_STATIC = 6;
  CATEGORY_WEAPON = 7;
  CATEGORY_SCENERY = 8;
  CATEGORY_BASE = 9;
  CATEGORY_CARGO = 10;
}

// DCS Lua environment.
enum Env {
  ENV_UNSPECIFIED = 0;
  ENV_HOOKS = 1;
  ENV_MISSION = 2;
}

enum Outcome {
  OUTCOME_UNSPECIFIED = 0;
  OUTCOME_BLUE_WIN = 1;
  OUTCOME_RED_WIN = 2;
  OUTCOME_DRAW = 3;
  OUTCOME_ABORTED = 4;
  OUTCOME_TIME_LIMIT = 5;
}

enum StartType {
  START_TYPE_UNSPECIFIED = 0;
  START_TYPE_RUNWAY = 1;
  START_TYPE_HOT = 2;
  START_TYPE_COLD = 3;
  START_TYPE_AIR = 4;
}

enum AlarmState {
  ALARM_STATE_UNSPECIFIED = 0;
  ALARM_STATE_AUTO = 1;
  ALARM_STATE_GREEN = 2;
  ALARM_STATE_RED = 3;
}

enum Roe {
  ROE_UNSPECIFIED = 0;
  ROE_WEAPON_FREE = 1;
  ROE_OPEN_FIRE_WEAPON_FREE = 2;
  ROE_OPEN_FIRE = 3;
  ROE_RETURN_FIRE = 4;
  ROE_WEAPON_HOLD = 5;
}

enum SmokeColor {
  SMOKE_COLOR_UNSPECIFIED = 0;
  SMOKE_COLOR_GREEN = 1;
  SMOKE_COLOR_RED = 2;
  SMOKE_COLOR_WHITE = 3;
  SMOKE_COLOR_ORANGE = 4;
  SMOKE_COLOR_BLUE = 5;
}

// Error codes shared by command results, state results and attach rejections.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  // The target object no longer exists in DCS (or its Eid generation is stale).
  ERROR_CODE_GONE = 1;
  // The deadline (timeout_ms) passed before the command ran or finished. With
  // CommandError.limit (0.4.0) the command waited and never ran in DCS; without it, it was
  // sent to DCS and no result came in time (it may still run).
  ERROR_CODE_TIMEOUT = 2;
  // The Lua layer raised an error; see lua_traceback.
  ERROR_CODE_LUA_ERROR = 3;
  // The bridge caught a panic or the op kind is disabled after repeated faults.
  ERROR_CODE_BRIDGE_FAULT = 4;
  // The engine refused the command (policy, mode, quota, missing --dev-eval, ...). A quota
  // (a rate, DCS time, a cap) sets CommandError.limit; a forbid sets `capability` only.
  ERROR_CODE_REJECTED = 5;
  // The session the command belongs to has ended.
  ERROR_CODE_SESSION_ENDED = 6;
  // The command is malformed or references unknown symbols.
  ERROR_CODE_INVALID = 7;
  // The feature or the bridge is not available right now. Messages for features that are
  // deliberately out of scope name the milestone, e.g. "hot reload lands in M4".
  ERROR_CODE_UNAVAILABLE = 8;
  // A spawn would reuse the name of an existing group/unit.
  ERROR_CODE_NAME_CONFLICT = 9;
  // The simulation is paused and the command asked to fail on pause.
  ERROR_CODE_PAUSED = 10;
  // The command kind is quarantined after it was running when DCS crashed.
  ERROR_CODE_QUARANTINED = 11;
  // Compare-and-swap failed (state documents).
  ERROR_CODE_CONFLICT = 12;
}

message CommandError {
  ErrorCode code = 1;
  string message = 2;
  // Lua traceback when code = ERROR_CODE_LUA_ERROR, otherwise empty.
  string lua_traceback = 3;
  // W1. For ERROR_CODE_UNAVAILABLE, REJECTED (gating) and QUARANTINED: the name of the
  // capability or operation that is missing, switched off or quarantined (see Capability.name).
  string capability = 4;
  // API revision 3 (0.4.0). Set when one of the engine's limits refused the command, or when
  // the command waited in the engine or the bridge for something until its deadline passed
  // (ERROR_CODE_TIMEOUT with `limit`: the command never ran in DCS; a TIMEOUT without it was
  // sent to DCS and may still run). Unset for every other error, a forbid included: a path
  // that is not in the catalog or is switched off, an operation the owner disabled
  // (ERROR_CODE_REJECTED with `capability` and no `limit`), which no retry helps. The code and
  // `capability` stay what they were before 0.4.0; this field is extra and filled for every
  // client, whatever revision it declares.
  Limit limit = 5;
}

// Which limit refused a command, or what it waited for (CommandError.limit; 0.4.0).
message Limit {
  LimitKind kind = 1;
  // The budget's stable name: "call_rate.read", "call_rate.mutate", "call_rate.heavy",
  // "call_rate.admin", "dcs_time.read", "dcs_time.heavy", "batch.calls", "request.bytes",
  // "handles.created", "handles.read", "bridge.slow_calls", "gate.spawn", "gate.warmup",
  // "window.spawns", "delay.tasking", "slot.heavy", "link.credits", "link.down",
  // "wait.after", "wait.queue", "bridge.deadline".
  string budget = 2;
  // Whose budget: the writer (the API token's name, else the logic's name) for the budgets of
  // a writer (call_rate.*, dcs_time.*); empty for limits of the session or of DCS.
  string writer = 3;
  // The budget's numbers, whole, in its unit (calls for call_rate.* and batch.calls,
  // microseconds of DCS time for dcs_time.*, bytes for request.bytes, handles for handles.*,
  // slow calls in 10 minutes for bridge.slow_calls): what it holds at most, what it refills a
  // second (0: it does not refill), what this command needed from it, and what it held when
  // the command was refused (below 0: a debt; rounded down). 0 where a number does not apply
  // (the waits).
  int64 capacity = 4;
  int64 per_second = 5;
  int64 needed = 6;
  int64 available = 7;
  // Milliseconds after the refusal at which this same command, sent again unchanged, passes
  // every rate budget it needs, if the writer sends nothing else meanwhile and no earlier
  // command's DCS time is charged meanwhile (a command in flight is charged when its result
  // comes back). Computed from the token buckets' refill (call_rate.*, dcs_time.*); 0 where no
  // refill can tell: a size or a cap (change the command), a wait (the deadline passed), a
  // heavy call refused while the writer's previous heavy call has not come back (dcs_time.heavy:
  // its cost is not known yet; send it again once that one answered).
  uint32 retry_after_ms = 8;
}

// The kind of a Limit. Refusals at submit (nothing was queued and no call ran): CALL_RATE and
// DCS_TIME (ERROR_CODE_REJECTED), BATCH_SIZE and REQUEST_SIZE (ERROR_CODE_INVALID),
// CREATED_HANDLES (ERROR_CODE_REJECTED; also from the Lua layer for one call of a batch).
// Refusals later: READ_HANDLES (ERROR_CODE_GONE: the layer dropped the handle), SLOW_CALLS
// (ERROR_CODE_QUARANTINED: the bridge refuses the path until DCS restarts). Waits (the command
// never ran in DCS): the rest, which end at the deadline (ERROR_CODE_TIMEOUT), and AFTER also
// when the `after` command failed (that command's code).
enum LimitKind {
  LIMIT_KIND_UNSPECIFIED = 0;
  // Calls per second of one class per writer (call_rate.read 200, mutate 50, heavy 2, admin 1).
  LIMIT_KIND_CALL_RATE = 1;
  // DCS time per second per writer (dcs_time.read, dcs_time.heavy: 20 ms a second each; a
  // batch is checked against the whole debt of dcs_time.read, a single read against that debt
  // floored at -20 ms). Also a writer's heavy call while its previous heavy call has not been
  // charged (dcs_time.heavy, retry_after_ms 0).
  LIMIT_KIND_DCS_TIME = 2;
  // Calls of one batch (batch.calls: 64, 256 reads).
  LIMIT_KIND_BATCH_SIZE = 3;
  // Bytes of one DcsCall or DcsBatch (request.bytes: 64 KiB).
  LIMIT_KIND_REQUEST_SIZE = 4;
  // Objects made by calls alive in the session and environment (handles.created: 256).
  LIMIT_KIND_CREATED_HANDLES = 5;
  // Handles of objects reads returned (handles.read: 1024, the least recently used dropped).
  LIMIT_KIND_READ_HANDLES = 6;
  // A catalog path three calls of which were slower than the bridge's 1 s watchdog in 10
  // minutes (bridge.slow_calls): refused until DCS restarts.
  LIMIT_KIND_SLOW_CALLS = 7;
  // The spawn gate (gate.spawn, gate.warmup) and the window of spawns in DCS (window.spawns).
  LIMIT_KIND_SPAWN_GATE = 8;
  LIMIT_KIND_SPAWN_WINDOW = 9;
  // The tasking delay after a spawn (delay.tasking: 2 frames and 0.5 s of model time).
  LIMIT_KIND_TASKING_DELAY = 10;
  // One heavy call at a time (slot.heavy).
  LIMIT_KIND_HEAVY_SLOT = 11;
  // Credits of the link to DCS (link.credits), or the link was down (link.down).
  LIMIT_KIND_LINK_CREDITS = 12;
  LIMIT_KIND_LINK_DOWN = 13;
  // The command named in `after` had not finished (ERROR_CODE_TIMEOUT), or failed: then the
  // error's code and capability are that command's (wait.after), and the same command sent
  // again fails the same way at once.
  LIMIT_KIND_AFTER = 14;
  // The deadline passed before the engine could look at the command (wait.queue).
  LIMIT_KIND_QUEUE = 15;
  // The bridge did not start the command before its deadline (bridge.deadline).
  LIMIT_KIND_BRIDGE_DEADLINE = 16;
}

// A Lua value as it crosses the bridge. An unset `kind` is nil as well.
// Lua strings are carried as UTF-8; the bridge converts invalid sequences lossily.
message LuaValue {
  oneof kind {
    LuaNil nil = 1;
    bool boolean = 2;
    double number = 3;
    string string = 4;
    LuaTable table = 5;
  }
}

message LuaNil {}

// A Lua table as an ordered list of pairs. Arrays use number keys 1..n in order.
message LuaTable {
  repeated LuaPair pairs = 1;
}

message LuaPair {
  LuaValue key = 1;
  LuaValue value = 2;
}

// =====================================================================================
// Selectors. GroupSel and UnitSel were declared in commands.proto by 0.1.0 and moved here
// in 0.2.0 (same package, names and field numbers: the wire format is unchanged).
// =====================================================================================

// Selects a group: by Eid (preferred), DCS name, or manifest symbol.
message GroupSel {
  oneof sel {
    uint64 eid = 1;
    string name = 2;
    string ident = 3;
  }
}

// Selects a unit: by Eid (preferred) or DCS name.
message UnitSel {
  oneof sel {
    uint64 eid = 1;
    string name = 2;
  }
}

// =====================================================================================
// Wave 1 (api_rev 1) additions: the shared vocabulary (spec, section 1).
//
// Rules for every selector, anchor, area and audience (spec, section 1.1):
//   - an unset oneof is ERROR_CODE_INVALID, never a default. A member added by a later
//     revision reaches an older engine as an unset oneof, so it fails instead of widening;
//   - an Eid of the wrong class for the selector is ERROR_CODE_INVALID;
//   - an Eid is checked against the mirror (unknown, removed or dead: ERROR_CODE_GONE); a
//     name is resolved in DCS when the command executes and acts on whoever holds it then;
//   - numbers must be finite (NaN and infinities are ERROR_CODE_INVALID).
// The 0.1.0 defaults stay: Message.to unset = everyone, Menu.coalition unset = everyone.
// =====================================================================================

// ---- W1: selectors ----
// Selects any world object (unit, static, cargo, weapon, ejected crew, scenery).
// Eid is preferred. Weapons and ejected crew have no name: they are addressed by Eid only
// (they get Eids when they appear in an event, since W1). Names are DCS runtime names.
message ObjSel {
  oneof sel {
    // An entity Eid (not a group or airbase Eid).
    uint64 eid = 1;
    string unit_name = 2;
    string static_name = 3;
    // Scenery (map) object: its map object name as a decimal string. Scenery has no other
    // stable name; the string is opaque to clients (taken from events, queries, the manifest).
    string scenery_name = 4;
  }
}

// Selects an airbase, FARP or ship deck: by Eid, DCS name or manifest symbol.
// `eid` takes the airbase Eid or the Eid of its host entity (the FARP static, the ship
// unit: AirbaseSnap.host_eid). Name lookups skip dead and removed airbases.
message AirbaseSel {
  oneof sel {
    uint64 eid = 1;
    string name = 2;
    string ident = 3;
  }
}

// Selects a connected player. `ucid` is stable across reconnects, `player_id` is the
// per-connection id carried by the Player* events, `name` is the current nickname.
// A name that two connected players share is ERROR_CODE_INVALID. A `player_id` is bound
// to the ucid it had when the command was submitted: if another connection holds the id
// when the command runs, the result is ERROR_CODE_GONE. Kick and ban take `ucid` only.
message PlayerSel {
  oneof sel {
    string ucid = 1;
    uint32 player_id = 2;
    string name = 3;
  }
}

// Selects a warehouse: the one of an airbase, the one inside a cargo/static object,
// or by the DCS warehouse name (Warehouse.getByName).
message WarehouseSel {
  oneof sel {
    AirbaseSel airbase = 1;
    ObjSel cargo = 2;
    string dcs_name = 3;
  }
}

// W2. A warehouse item as DCS's Warehouse functions take it: its name as DCS gives it (a
// weapon such as "weapons.missiles.AIM_120C", an aircraft type) or its wsType. An unset
// `item`, an empty name or a wsType level above 2^31 - 1 is ERROR_CODE_INVALID. That the two
// forms of one item count the same stock is reported, not measured (live check AWC-T6).
message WarehouseItem {
  oneof item {
    string name = 1;
    WsType ws_type = 2;
  }
}

// The four levels of a DCS wsType ({level1, level2, level3, level4}, e.g. {4, 4, 7, 106}; the
// numbers of the game's Scripts/Database/wsTypes.lua).
message WsType {
  uint32 level1 = 1;
  uint32 level2 = 2;
  uint32 level3 = 3;
  uint32 level4 = 4;
}

// W2. A liquid of a warehouse. DCS numbers them 0..3; the Lua layer maps the numbers to these
// names and back.
enum Liquid {
  LIQUID_UNSPECIFIED = 0;
  // DCS 0.
  LIQUID_JET_FUEL = 1;
  // DCS 1.
  LIQUID_AVIATION_GASOLINE = 2;
  // DCS 2: the water-methanol mixture.
  LIQUID_MW50 = 3;
  // DCS 3.
  LIQUID_DIESEL = 4;
  // A number this build has no name for; the answer keeps it as text.
  LIQUID_UNKNOWN = 5;
}

// Selects a trigger zone: manifest symbol or mission-editor zone name.
message ZoneSel {
  oneof sel {
    string ident = 1;
    string name = 2;
  }
}

// Selects an AI controller: of a group (the normal case) or of one unit (aircraft, ships).
// An unset `sel` is ERROR_CODE_INVALID.
message ControllerSel {
  oneof sel {
    GroupSel group = 1;
    UnitSel unit = 2;
  }
}

// Who sees or hears something. Each consumer states which members it accepts; a member it
// cannot serve is ERROR_CODE_INVALID, never a silent widening to a larger audience.
// An unset `to` (which is also how a member added by a later revision reaches an engine
// that does not know it) and `all = false` are ERROR_CODE_INVALID.
message Audience {
  oneof to {
    bool all = 1;
    Coalition coalition = 2;
    // DCS country key as in the country.id table, e.g. "USA".
    string country = 3;
    GroupSel group = 4;
    UnitSel unit = 5;
    PlayerSel player = 6;
  }
}

// ---- W1: anchor ----
// A place: a fixed 3D point, a point on the ground, a live object (follows it for as long
// as the consumer says it does), or the centre of a zone.
message Anchor {
  oneof at {
    // Used as given.
    Vec3 point = 1;
    // Terrain height is looked up in DCS when the command executes.
    MapPoint ground = 2;
    // Position of the object when the command executes; ERROR_CODE_GONE if it is gone.
    ObjSel object = 3;
    // Zone centre on the ground.
    ZoneSel zone = 4;
  }
  // Added to the height of the resolved point (metres, may be negative).
  double height_offset_m = 5;
}

// ---- W1: areas and volumes ----
message MapCircle {
  MapPoint center = 1;
  double radius_m = 2;
}

// Vertices in order; the polygon is closed implicitly. 3..=64 points.
message MapPolygon {
  repeated MapPoint points = 1;
}

// A circle that is evaluated around the current position of an object.
message AroundObject {
  ObjSel object = 1;
  double radius_m = 2;
}

// A 2D area on the map.
message MapArea {
  oneof area {
    ZoneSel zone = 1;
    MapCircle circle = 2;
    MapPolygon polygon = 3;
    AroundObject around = 4;
  }
}

// A 3D volume. sphere, axis_box, segment and pyramid are the DCS volume types
// (world.VolumeType). `area` is Sortie's own: a consumer that filters results itself
// (SearchObjects, W2) evaluates it exactly on top of a bounding DCS volume; a consumer
// that hands the volume to DCS (RemoveJunk) accepts only what it can express exactly.
message Volume {
  oneof shape {
    Sphere sphere = 1;
    AxisBox axis_box = 2;
    Segment segment = 3;
    Pyramid pyramid = 4;
    AreaVolume area = 5;
  }
}

message Sphere {
  Vec3 center = 1;
  double radius_m = 2;
  // true: ignore center.y and put the centre on the terrain.
  bool center_on_ground = 3;
}

// Axis-aligned box (world.VolumeType.BOX).
message AxisBox {
  Vec3 min = 1;
  Vec3 max = 2;
}

message Segment {
  Vec3 start = 1;
  Vec3 end = 2;
}

message Pyramid {
  Vec3 apex = 1;
  double heading_rad = 2;
  double pitch_rad = 3;
  double length_m = 4;
  double half_angle_hor_rad = 5;
  double half_angle_ver_rad = 6;
}

// A map area extruded between two heights above sea level. Unset = the engine's band
// around the terrain: 200 m below the lowest and 20 000 m above the highest terrain point
// of the area (never an unbounded volume).
message AreaVolume {
  MapArea area = 1;
  optional double floor_m = 2;
  optional double ceiling_m = 3;
}

// ---- W1: small shared values ----
// Colour, each channel 0..1.
message Rgba {
  float r = 1;
  float g = 2;
  float b = 3;
  float a = 4;
}

enum Modulation {
  MODULATION_UNSPECIFIED = 0;
  MODULATION_AM = 1;
  MODULATION_FM = 2;
}

// What a spawn does when the name is already used by a live object.
enum NameConflict {
  // = FAIL.
  NAME_CONFLICT_UNSPECIFIED = 0;
  // ERROR_CODE_NAME_CONFLICT (0.1.0 behaviour).
  NAME_CONFLICT_FAIL = 1;
  // Destroy the holder, then spawn. Only a holder of the same class as the new object
  // (a static for SpawnStatic, a group for SpawnGroup) that no player occupies; anything
  // else is ERROR_CODE_NAME_CONFLICT. Everything is validated before the holder is
  // destroyed. UnitGone for the holder: GONE_REASON_REPLACED when the new object exists,
  // GONE_REASON_DESPAWNED when the spawn failed after the destroy.
  NAME_CONFLICT_REPLACE = 2;
  // Do nothing; the result describes the existing object. Only when the holder has the
  // same class and type as requested and is alive; otherwise ERROR_CODE_NAME_CONFLICT.
  NAME_CONFLICT_KEEP = 3;
}

// ---- W1: capabilities ----
// Class of an allow-listed DCS function. It decides the lane and the gating.
enum CallClass {
  CALL_CLASS_UNSPECIFIED = 0;
  // No side effect and a bounded cost. LANE_QUERY. On by default when its signature is
  // documented and its probe passed (spec 2.3).
  CALL_CLASS_READ = 1;
  // Changes the simulation. LANE_REALTIME (mission) or LANE_CONTROL (hooks).
  // Only by an explicit allow-list entry of the engine owner.
  CALL_CLASS_MUTATE = 2;
  // Costly in the simulation thread (lists of objects, full tables, path finding).
  // LANE_BULK, rate limited, never two in one frame.
  CALL_CLASS_HEAVY = 3;
  // Server administration. LANE_CONTROL; needs the engine owner's admin capability for the path as well (admin.*).
  CALL_CLASS_ADMIN = 4;
}

enum CapabilityState {
  CAPABILITY_STATE_UNSPECIFIED = 0;
  CAPABILITY_STATE_AVAILABLE = 1;
  // Declared in this API revision, not built into this engine/bridge/Lua layer yet.
  CAPABILITY_STATE_NOT_IMPLEMENTED = 2;
  // The DCS function or table it needs does not exist in the running DCS build.
  CAPABILITY_STATE_MISSING_IN_DCS = 3;
  // Switched off: by the engine owner (allow-list entry, admin list, --dev-eval), or
  // because the call is undocumented and no probe pass is recorded for the running DCS
  // build (`note` says which).
  CAPABILITY_STATE_DISABLED = 4;
  // Was executing when DCS crashed, or faulted repeatedly.
  CAPABILITY_STATE_QUARANTINED = 5;
}

// Result of the automatic live checks of a capability (spec, section 9). Information for
// the owner and the logic author; the engine itself gates on it only for undocumented calls.
enum LiveStatus {
  LIVE_STATUS_UNSPECIFIED = 0;
  // No automatic check has passed for it.
  LIVE_STATUS_UNVERIFIED = 1;
  // Its automatic checks passed on the DCS build named in `verified_dcs` (compare with
  // CapabilitiesResponse.dcs_version to know whether that is the running build).
  LIVE_STATUS_VERIFIED = 2;
  // An automatic check failed on the running build; `note` says what differs.
  LIVE_STATUS_FAILED = 3;
}

// How the engine validates one allow-listed call (the merged allow-list entry, spec 2.5).
message CallSignature {
  Env env = 1;
  CallClass call_class = 2;
  // "function" or "value".
  string kind = 3;
  // "" for a plain function, else the class that defines the method ("Unit", "Object", ...).
  string receiver = 4;
  // Argument and return types in the allow-list notation, e.g. "vec2", "object:Unit",
  // "enum:trigger.smokeColor", "side_name".
  repeated string args = 5;
  repeated string returns = 6;
  // Guards the engine applies before the call, e.g. "controller_gate", "player_guard".
  repeated string guards = 7;
}

// One thing the engine can do. Names:
//   "<operation>"                       e.g. "spawn_static", "draw", "query.terrain"
//   "<operation>.<member>"              e.g. "draw.arrow", "destroy.scenery", "admin.kick"
//   "call:<env>:<function path>"        e.g. "call:mission:land.getSurfaceType"
//   "table:<name>"                      e.g. "table:world.event", "table:sortie.line_type"
message Capability {
  string name = 1;
  CapabilityState state = 2;
  LiveStatus live = 3;
  // DCS build the automatic checks last passed on, empty if never.
  string verified_dcs = 4;
  // Ids from the live-check catalogue that cover this capability.
  repeated string live_checks = 5;
  // API revision that introduced it.
  uint32 since_api_rev = 6;
  string note = 7;
  // "call:*" capabilities: the signature of the call.
  CallSignature signature = 8;
  // "call:*" capabilities: the typed operation that replaces this raw path (a capability
  // name), empty if none. The SDK warns once per superseded path a logic uses.
  string superseded_by = 9;
}
