# Sortie SDK 0.1.0: the SDK crates and the compiled examples of the docs.
#
# template/ and examples/ are separate projects. They depend on the SDK through git, the way
# client projects do; CI builds a copy of each against the crates of this repository.
[workspace]
resolver = "3"
members = [
    "crates/sortie-proto",
    "crates/sortie-types",
    "crates/sortie-world",
    "crates/sortie-manifest",
    "crates/sortie-build",
    "crates/sortie-macros",
    "crates/sortie",
    "snippets",
]
exclude = ["template", "examples"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
authors = ["Sortie contributors"]
publish = false

[workspace.dependencies]
# SDK crates
sortie = { path = "crates/sortie", version = "0.1.0" }
sortie-proto = { path = "crates/sortie-proto", version = "0.1.0", default-features = false }
sortie-types = { path = "crates/sortie-types", version = "0.1.0" }
sortie-world = { path = "crates/sortie-world", version = "0.1.0" }
sortie-manifest = { path = "crates/sortie-manifest", version = "0.1.0" }
sortie-build = { path = "crates/sortie-build", version = "0.1.0" }
sortie-macros = { path = "crates/sortie-macros", version = "0.1.0" }

# Third-party crates
tokio = { version = "1.54.1" }
tokio-stream = { version = "0.1.19" }
futures = { version = "0.3.34" }
prost = { version = "0.14.4" }
prost-types = { version = "0.14.4" }
tonic = { version = "0.14.9" }
tonic-prost = { version = "0.14.9" }
tonic-prost-build = { version = "0.14.9" }
protox = { version = "0.10.0" }
slotmap = { version = "1.1.1" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = { version = "0.11.1" }
hex = { version = "0.4.3" }
thiserror = { version = "2.0.21" }
miette = { version = "7.6.0" }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
syn = { version = "3.0.9", features = ["full"] }
quote = { version = "1.0.47" }
proc-macro2 = { version = "1.0.107" }
prettyplease = { version = "0.3.0" }
heck = { version = "0.5.0" }
insta = { version = "1.49.0", features = ["yaml", "json"] }
proptest = { version = "1.12.0" }
trybuild = { version = "1.0.122" }
tempfile = { version = "3.27.0" }
pretty_assertions = { version = "1.4.1" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "allow"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
large_futures = "warn"
needless_pass_by_value = "allow"

[profile.dev]
debug = "line-tables-only"
